name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  # 每小时重新部署一次，顺便刷新圣黛故事的计数快照（不产生提交）
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      # 计数快照：在 GitHub 的服务器上读 Abacus，写成同站的 stats/shengdai.json。
      # 有些网络或拦截插件连不上 Abacus，博客就先读这个文件。读失败不影响部署。
      - name: Snapshot game counters
        # 计数服务不太稳定（偶尔超时）：每个数单独取、最多试 3 次；取到的数只升不降，取不到就保留上次的。
        # 每次的结果写进公开的 stats/snapshot-log.txt，方便排查（不含任何私密信息）。
        run: |
          mkdir -p stats
          python3 - <<'PY'
          import json, time, urllib.request, datetime
          path, log = "stats/shengdai.json", []
          try: old = json.load(open(path))
          except Exception: old = {}
          new, got = dict(old), 0
          for k in ("open", "start", "starc"):
              for n in range(3):
                  try:
                      req = urllib.request.Request(f"https://abacus.jasoncameron.dev/get/starc-shengdai/{k}", headers={"User-Agent": "starc-snapshot/1.0"})
                      v = int(json.load(urllib.request.urlopen(req, timeout=15))["value"])
                      log.append(f"{k} try{n+1}: {v}"); new[k] = max(v, old.get(k) or 0); got += 1; break
                  except Exception as e:
                      log.append(f"{k} try{n+1}: {type(e).__name__} {e}"); time.sleep(5)
          now = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%MZ")
          if got: new["at"] = now
          json.dump(new, open(path, "w")); open("stats/snapshot-log.txt", "w").write(f"run {now}, got {got}/3\n" + "\n".join(log) + "\n")
          print(open("stats/snapshot-log.txt").read(), json.dumps(new))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
