<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent-Era Tools</title>
<style>
:root{--wall:#dcd8d0;--wall-ink:#2a2826;--wall-muted:#5d5852;--pin:#b23a2a}
@media (prefers-color-scheme:dark){:root{--wall:#1d1c1b;--wall-ink:#ece8e1;--wall-muted:#a7a199;--pin:#e0705c}}
*{box-sizing:border-box}
html{background:var(--wall)}
body{margin:0;color:var(--wall-ink);font:15px/1.5 ui-sans-serif,-apple-system,"Helvetica Neue","PingFang SC",sans-serif;
  background:var(--wall) radial-gradient(circle at 1px 1px,rgba(0,0,0,.07) 1px,transparent 0) 0 0/18px 18px}
.wall{max-width:1120px;margin:0 auto;padding:44px 16px 72px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:34px}
.top h1{margin:0;font:600 13px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}
.top p{margin:10px 0 0;max-width:520px;color:var(--wall-muted);font-size:15px}
.lng{background:none;border:0;color:var(--wall-ink);font:500 13px ui-monospace,Menlo,monospace;cursor:pointer;padding:4px 0;border-bottom:1px dashed currentColor}
.board{display:grid;grid-template-columns:repeat(12,1fr);gap:22px;align-items:start}
:where(.board>a){color:inherit}
.board>a{display:block;text-decoration:none;position:relative;transition:transform .2s ease,box-shadow .2s ease;box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 20px rgba(0,0,0,.12)}
.board>a:hover,.board>a:focus-visible{transform:translateY(-3px) rotate(0deg)!important;box-shadow:0 2px 4px rgba(0,0,0,.2),0 16px 32px rgba(0,0,0,.18)}
.board>a::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--pin);box-shadow:0 2px 3px rgba(0,0,0,.35);z-index:2}

/* field guide plate */
.fg{grid-column:1/span 5;background:#f1e6cf;color:#2b2218;padding:26px 26px 22px;font-family:"Iowan Old Style",Palatino,Georgia,"Songti SC",serif;transform:rotate(-1.2deg)}
.fg .plate{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a3b26;border-bottom:1px solid #b9a581;padding-bottom:8px;display:flex;justify-content:space-between}
.fg svg{display:block;margin:18px auto 6px}
.fg .latin{text-align:center;font-style:italic;font-size:14px;color:#5b4a35}
.fg h2{text-align:center;margin:2px 0 10px;font-weight:400;font-size:26px}
.fg p{margin:0;font-size:15px;line-height:1.55;color:#3e3326}

/* tidy */
.td{grid-column:7/span 5;margin-top:46px;background:#f7f3ec;color:#3a3530;padding:34px 30px;font-family:"Avenir Next","Hiragino Sans","PingFang SC",sans-serif;border-radius:3px;transform:rotate(.8deg)}
.td .steps{display:flex;gap:8px;align-items:center;margin-bottom:26px}
.td .steps i{width:22px;height:22px;border-radius:50%;border:1px solid #b9ad9e;display:block}
.td .steps i.on{background:#a5543a;border-color:#a5543a}
.td .steps b{flex:1;height:1px;background:#cfc5b8}
.td .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8d4a33}
.td h2{font-family:Georgia,"Songti SC",serif;font-weight:400;font-size:28px;margin:6px 0 12px}
.td p{margin:0 0 20px;color:#5a534b}
.td .fold{display:flex;flex-direction:column;gap:4px;width:120px}
.td .fold span{height:9px;border-radius:2px;background:#c9b9a3}
.td .fold span:nth-child(2){background:#a9b59b;width:92%}
.td .fold span:nth-child(3){background:#d7c7b0;width:84%}

/* replay strip */
.rp{grid-column:2/span 10;background:#141518;color:#d9dce1;font-family:ui-monospace,"SF Mono",Menlo,monospace;padding:0;transform:rotate(-.4deg);overflow:hidden}
.rp .bar{display:flex;gap:18px;padding:8px 14px;font-size:12px;color:#8b9099;border-bottom:1px solid #26282d}
.rp .bar em{margin-left:auto;font-style:normal;color:#c7f24a}
.rp .body{display:grid;grid-template-columns:1.1fr 1fr;gap:0}
.rp .mon{padding:22px 22px 18px;border-right:1px solid #26282d}
.rp .tc{font-size:30px;color:#c7f24a;letter-spacing:.04em}
.rp h2{font:600 22px/1.25 ui-sans-serif,-apple-system,"PingFang SC",sans-serif;margin:12px 0 8px;color:#f2f3f5}
.rp p{margin:0;font:14.5px/1.55 ui-sans-serif,-apple-system,"PingFang SC",sans-serif;color:#a9aeb7}
.rp .tl{padding:18px 16px;display:flex;flex-direction:column;gap:9px;justify-content:center;position:relative}
.rp .trk{display:flex;align-items:center;gap:8px;font-size:10px;color:#6c717a}
.rp .trk span{width:20px}
.rp .trk div{flex:1;height:12px;position:relative}
.rp .trk div i{position:absolute;top:0;bottom:0;border-radius:2px}
.rp .head{position:absolute;top:10px;bottom:10px;left:58%;width:2px;background:#ff4d4d}

/* ship log poster */
.sl{grid-column:8/span 4;margin-top:-6px;background:#0f0f10;color:#fff;padding:24px 22px 20px;font-family:"Avenir Next Condensed","Futura","PingFang SC",Impact,sans-serif;transform:rotate(1.6deg);
  background-image:repeating-linear-gradient(135deg,transparent 0 22px,rgba(215,255,31,.06) 22px 24px)}
.sl .band{display:flex;justify-content:space-between;font-weight:700;font-size:12px;letter-spacing:.12em;color:#d7ff1f;text-transform:uppercase}
.sl .num{font:italic 900 108px/0.9 "Avenir Next Condensed","Futura",Impact,sans-serif;color:#d7ff1f;margin:14px 0 2px;letter-spacing:-.02em}
.sl h2{font:italic 800 28px/1.05 "Avenir Next Condensed","Futura",Impact,"PingFang SC",sans-serif;margin:0 0 10px;text-transform:uppercase}
.sl p{margin:0;font:500 14.5px/1.45 -apple-system,"PingFang SC",sans-serif;color:#cfd1c8}
.sl .chk{height:10px;margin:16px -22px -20px;background:repeating-conic-gradient(#d7ff1f 0 25%,#0f0f10 0 50%) 0 0/10px 10px}

/* sticky note */
.note{grid-column:1/span 6;margin-top:10px;background:#f6e27a;color:#3a3210;padding:20px 22px;font:16px/1.5 "Bradley Hand","Marker Felt","Kaiti SC",cursive;transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.12)}

@media (max-width:820px){
  .fg,.td,.rp,.sl,.note{grid-column:1/-1;margin-top:0}
  .rp .body{grid-template-columns:1fr}
  .rp .mon{border-right:0;border-bottom:1px solid #26282d}
  .board{gap:30px}
}
@media (prefers-reduced-motion:reduce){.board>a{transition:none}}
</style>
</head>
<body>
<div class="wall">
  <div class="top">
    <div><h1 data-t="kicker"></h1><p data-t="lede"></p></div>
    <button class="lng" id="lng" type="button"></button>
  </div>

  <div class="board">
    <a class="fg" href="agent-analytics/index.html">
      <div class="plate"><span data-t="fgPlate"></span><span>No. 41</span></div>
      <svg width="120" height="82" viewBox="0 0 120 82" aria-hidden="true">
        <g fill="none" stroke="#2b2218" stroke-width="1.2">
          <path d="M60 18 C 52 4, 40 2, 34 6"/><path d="M60 18 C 68 4, 80 2, 86 6"/>
          <ellipse cx="60" cy="44" rx="11" ry="20" fill="#c9a875"/>
          <path d="M50 36 C 26 18, 8 30, 14 46 C 20 60, 42 56, 50 48 Z" fill="#9db29a" fill-opacity=".55"/>
          <path d="M70 36 C 94 18, 112 30, 106 46 C 100 60, 78 56, 70 48 Z" fill="#9db29a" fill-opacity=".55"/>
          <path d="M60 30 V 62 M54 44 H66 M55 52 H65"/>
        </g>
      </svg>
      <div class="latin">Crawlerus openaii</div>
      <h2 data-t="fgTitle"></h2>
      <p data-t="fgDesc"></p>
    </a>

    <a class="td" href="data-tidy/index.html">
      <div class="steps"><i class="on"></i><b></b><i></i><b></b><i></i><b></b><i></i></div>
      <div class="k" data-t="tdK"></div>
      <h2 data-t="tdTitle"></h2>
      <p data-t="tdDesc"></p>
      <div class="fold" aria-hidden="true"><span></span><span></span><span></span></div>
    </a>

    <a class="rp" href="agent-replay/index.html">
      <div class="bar"><span>File</span><span>Render</span><span>View</span><em>● LOCAL</em></div>
      <div class="body">
        <div class="mon">
          <div class="tc">00:04:35:12</div>
          <h2 data-t="rpTitle"></h2>
          <p data-t="rpDesc"></p>
        </div>
        <div class="tl" aria-hidden="true">
          <div class="trk"><span>V1</span><div><i style="left:2%;width:3%;background:#5b8def"></i><i style="left:44%;width:4%;background:#5b8def"></i><i style="left:93%;width:3%;background:#5b8def"></i></div></div>
          <div class="trk"><span>V2</span><div><i style="left:5%;width:6%;background:#e8a33d"></i><i style="left:15%;width:9%;background:#e8a33d"></i><i style="left:30%;width:5%;background:#e8a33d"></i></div></div>
          <div class="trk"><span>V3</span><div><i style="left:8%;width:2%;background:#e4643b"></i><i style="left:14%;width:3%;background:#e4643b"></i><i style="left:27%;width:6%;background:#e4643b"></i><i style="left:52%;width:4%;background:#e4643b"></i><i style="left:88%;width:3%;background:#e4643b"></i></div></div>
          <div class="trk"><span>E1</span><div><i style="left:18%;width:1.5%;background:#ff4d4d"></i><i style="left:36%;width:1.5%;background:#ff4d4d"></i></div></div>
          <div class="trk"><span>A1</span><div style="background:repeating-linear-gradient(90deg,#3c7a5a 0 2px,transparent 2px 5px);opacity:.8"></div></div>
          <div class="head"></div>
        </div>
      </div>
    </a>

    <div class="note" data-t="note"></div>

    <a class="sl" href="ship-log/index.html">
      <div class="band"><span data-t="slBand"></span><span>WK 44</span></div>
      <div class="num">7</div>
      <h2 data-t="slTitle"></h2>
      <p data-t="slDesc"></p>
      <div class="chk"></div>
    </a>
  </div>
</div>
<script>
var copy={
 zh:{kicker:"Agent 时代的小工具",lede:"四个专注的小工具，帮你看清 AI Agent 在做什么、读什么，也帮你自己保持出货的节奏。",
  fgPlate:"图版 · 来访者",fgTitle:"智能体野外图鉴",fgDesc:"把网站访问日志拖进来，就能看到来过哪些 AI 爬虫和 Agent，它们在找什么，又在哪里扑了空。",
  tdK:"第一步 · 归拢",tdTitle:"把数据整理成 Agent 读得懂的样子",tdDesc:"放进一张杂乱的表格，逐列看清问题，一键清理，最后附上一份数据说明书。",
  rpTitle:"Agent 放映室",rpDesc:"把 Agent 的运行记录当成一段素材来剪：一步步回放，每次工具调用、每个报错、每笔 token 都在时间线上。",
  note:"每个工具都备好了示例数据，打开就能在一分钟内看完整个流程。",
  slBand:"本周成绩",slTitle:"上线了才算",slDesc:"为创业者做的训练日志：只记录真正发布出去的东西，有连续周数、奖牌和可以分享的周报海报。"},
 en:{kicker:"Tools for the agent era",lede:"Four focused tools for seeing what AI agents read and do, and for keeping your own shipping streak alive.",
  fgPlate:"Plate · Visitors",fgTitle:"Agent Field Guide",fgDesc:"Drop in your server log and see which AI crawlers and agents came by, what they were after, and where they came up empty.",
  tdK:"Step one · Gather",tdTitle:"Tidy your data until an agent can read it",tdDesc:"Bring a messy spreadsheet, look at it column by column, clean it in a pass, and leave with a data dictionary.",
  rpTitle:"Agent Replay",rpDesc:"Cut an agent's run log like footage. Replay it step by step with every tool call, error and token on the timeline.",
  note:"Each one comes with sample data, so you can see the whole thing in about a minute.",
  slBand:"This week",slTitle:"It only counts if it shipped",slDesc:"A training log for founders. Log what you actually put out there, keep the streak, earn medals, post the weekly poster."}};
var lang="zh";try{lang=(function(){try{var q=new URLSearchParams(location.search).get('lang');q=q&&q.toLowerCase();return q==='en'?'en':(q==='zh'||q==='cn')?'zh':null}catch(e){return null}})()||localStorage.getItem("wb-lang")||((navigator.language||"").indexOf("zh")===0?"zh":"en")}catch(e){}
function paint(){var d=copy[lang];document.documentElement.lang=lang==="zh"?"zh":"en";
 document.querySelectorAll("[data-t]").forEach(function(n){n.textContent=d[n.getAttribute("data-t")]});
 document.getElementById("lng").textContent=lang==="zh"?"Read in English":"切换到中文";document.title=lang==="zh"?"Agent 时代的小工具":"Agent-Era Tools";
 document.querySelectorAll(".board>a").forEach(function(a){a.href=a.getAttribute("href").split("?")[0]+"?lang="+lang})}
document.getElementById("lng").addEventListener("click",function(){lang=lang==="zh"?"en":"zh";try{localStorage.setItem("wb-lang",lang)}catch(e){}paint()});
paint();
</script>
</body>
</html>
