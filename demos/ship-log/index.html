<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0c0a">
<title>Ship Log</title>
<style>
:root{
  --asphalt:#f1f1ea; --track:#ffffff; --lane:#e8e9e0; --chalk:#0d0e0b; --dust:#5f6358; --rule:#d9dbd0;
  --volt:#d7ff1f; --on-volt:#0b0c0a; --volt-ink:#3f5a00; --flare:#e5281c; --flare-soft:#ffe3df;
  --h0:#e2e4d9; --h1:#e6f7a3; --h2:#c4ec3d; --h3:#8fb80a; --h4:#4d6b00;
  --backdrop:#d7ff1f; --backdrop-stripe:rgba(11,12,10,.08); --backdrop-word:rgba(11,12,10,.07);
  --lift:0 1px 0 rgba(0,0,0,.04),0 10px 30px -12px rgba(0,0,0,.18);
  --display:"Avenir Next Condensed","AvenirNextCondensed-HeavyItalic","Futura-CondensedExtraBold","Futura Condensed ExtraBold","DIN Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",Impact,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --col:440px;
}
@media (prefers-color-scheme: dark){
  :root{
    --asphalt:#0b0c0a; --track:#151713; --lane:#1f221c; --chalk:#f3f5ec; --dust:#9ca291; --rule:#2a2e25;
    --volt-ink:#d7ff1f; --flare:#ff4a3d; --flare-soft:#3a1412;
    --h0:#1d2019; --h1:#3c4a10; --h2:#6b8a0d; --h3:#a6d10f; --h4:#d7ff1f;
    --backdrop:#060705; --backdrop-stripe:rgba(215,255,31,.06); --backdrop-word:rgba(215,255,31,.05);
    --lift:0 1px 0 rgba(255,255,255,.03),0 14px 30px -14px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--asphalt);color:var(--chalk);font:16px/1.45 var(--body);overflow-x:hidden;min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
.disp{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:condensed;letter-spacing:-.01em;text-transform:uppercase;line-height:.9}
:lang(zh) .disp{letter-spacing:0}

/* ---------- desktop stage ---------- */
.stage-word{display:none}
@media (min-width:620px){
  body{background:var(--backdrop) repeating-linear-gradient(-58deg,transparent 0 46px,var(--backdrop-stripe) 46px 60px)}
  .stage-word{display:block;position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .stage-word span{position:absolute;font-family:var(--display);font-weight:900;font-style:italic;font-stretch:condensed;font-size:24vw;line-height:.8;color:var(--backdrop-word);white-space:nowrap;transform:rotate(-8deg)}
  .stage-word span:nth-child(1){left:-4vw;top:4vh}
  .stage-word span:nth-child(2){right:-6vw;bottom:2vh}
  .rig{box-shadow:0 0 0 1px var(--rule),0 40px 80px -30px rgba(0,0,0,.6)}
}
.rig{position:relative;z-index:1;max-width:var(--col);margin:0 auto;min-height:100vh;background:var(--asphalt);padding-bottom:calc(176px + env(safe-area-inset-bottom))}

/* ---------- top ---------- */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:20;background:var(--asphalt)}
.masthead::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(var(--asphalt),transparent);pointer-events:none}
.wordmark{display:flex;align-items:center;gap:10px;min-width:0}
.wordmark-chip{width:38px;height:38px;flex:none;background:var(--volt);color:var(--on-volt);display:grid;place-items:center;transform:skewX(-12deg);border-radius:6px}
.wordmark-chip svg{transform:skewX(12deg)}
.wordmark-name{font-size:30px}
.wordmark-sub{font-size:12px;color:var(--dust);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-btn{width:42px;height:42px;border-radius:50%;border:2px solid var(--chalk);background:var(--track);display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:900;font-style:italic;font-size:20px;text-transform:uppercase;padding:0}
.storage-note{margin:4px 16px 0;padding:10px 12px;border-radius:10px;background:var(--flare-soft);color:var(--chalk);font-size:13px;border-left:4px solid var(--flare)}

/* ---------- shared blocks ---------- */
.slab{background:var(--track);border-radius:18px;box-shadow:var(--lift);margin:0 16px 14px;padding:16px;position:relative;overflow:hidden}
.kicker{display:flex;align-items:center;gap:10px;margin:22px 16px 10px}
.kicker h2{margin:0;font-size:26px}
.kicker .tally{margin-left:auto;font-family:var(--display);font-weight:900;font-style:italic;font-size:22px;color:var(--dust)}
.kicker::before{content:"";width:22px;height:18px;background:var(--volt);transform:skewX(-20deg);flex:none;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.slash{height:18px;margin:6px 0 2px;background:repeating-linear-gradient(-60deg,var(--volt) 0 10px,transparent 10px 20px);opacity:.9;clip-path:polygon(0 70%,100% 0,100% 30%,0 100%)}
.manifesto{margin:0 16px 4px;padding:10px 14px;font-size:14px;font-weight:600;color:var(--chalk);background:var(--lane);border-radius:12px;transform:skewX(-6deg)}
.manifesto>span{display:block;transform:skewX(6deg)}
.manifesto b{background:var(--volt);color:var(--on-volt);padding:0 5px;border-radius:3px}

.go{appearance:none;border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none}
.go-volt{background:var(--volt);color:var(--on-volt)}
.go-ink{background:var(--chalk);color:var(--asphalt)}
.go-ghost{background:var(--lane);color:var(--chalk)}
.go-flare{background:transparent;color:var(--flare);box-shadow:inset 0 0 0 2px var(--flare)}
.go:active{transform:scale(.97)}
.go[disabled]{opacity:.45}
.go-row{display:flex;gap:10px;flex-wrap:wrap}
.go-row .go{flex:1 1 140px}

/* ---------- hero (feed) ---------- */
.heat-sheet{background:var(--chalk);color:var(--asphalt);margin:0 16px 14px;border-radius:20px;padding:16px 16px 26px;position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),0 100%)}
@media (prefers-color-scheme: dark){.heat-sheet{background:var(--track);color:var(--chalk);box-shadow:inset 0 0 0 1px var(--rule)}}
.heat-sheet::before{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:120%;background:repeating-linear-gradient(-60deg,var(--volt) 0 3px,transparent 3px 16px);opacity:.18;transform:skewX(-14deg)}
.wk-switch{display:flex;align-items:center;gap:8px;position:relative}
.wk-switch .wk-label{flex:1;min-width:0}
.wk-eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.wk-range{font-size:24px}
.nudge{width:40px;height:40px;border-radius:50%;border:0;background:rgba(127,127,127,.18);color:inherit;display:grid;place-items:center;flex:none}
.nudge[disabled]{opacity:.3}
.scoreline{display:flex;align-items:center;gap:16px;margin-top:14px;position:relative}
.dial{position:relative;width:132px;height:132px;flex:none}
.dial svg{width:100%;height:100%;display:block}
.dial-track{fill:none;stroke:rgba(127,127,127,.25);stroke-width:14}
.dial-fill{fill:none;stroke:var(--volt);stroke-width:14;animation:dialIn .9s cubic-bezier(.2,.9,.2,1) both}
@keyframes dialIn{from{opacity:0;stroke-width:3}}
.dial-read{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.dial-read .disp{font-size:54px}
.dial-read small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:2px}
.dial.is-done .dial-read .disp{color:var(--volt);text-shadow:0 0 18px rgba(215,255,31,.4)}
.streak-stack{min-width:0;flex:1}
.streak-num{display:flex;align-items:flex-end;gap:6px}
.streak-num .disp{font-size:72px}
.streak-num svg{margin-bottom:8px;flex:none}
.streak-cap{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.streak-best{margin-top:8px;font-size:13px;font-weight:700;opacity:.8}
.callout{margin-top:14px;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;position:relative;background:rgba(127,127,127,.15)}
.callout.is-win{background:var(--volt);color:var(--on-volt)}
.callout.is-risk{background:var(--flare);color:#fff}
.splits{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;position:relative}
.split{text-align:center;font-size:11px;font-weight:800;opacity:.75}
.split i{display:block;height:30px;margin-top:4px;border-radius:6px;background:rgba(127,127,127,.18);transform:skewX(-10deg);position:relative;font-style:normal;font-family:var(--display);font-weight:900;font-size:18px;line-height:30px;opacity:1}
.split i.on{background:var(--volt);color:var(--on-volt)}
.split.is-today{opacity:1}
.split.is-today i{box-shadow:0 0 0 2px currentColor}
.focus-strip{margin:0 16px 14px;padding:12px 14px;border-radius:14px;background:var(--lane);display:flex;gap:12px;align-items:flex-start}
.focus-strip b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dust)}
.focus-strip p{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}

/* ---------- activity feed ---------- */
.activity{background:var(--track);border-radius:18px;box-shadow:var(--lift);margin:0 16px 12px;padding:14px;display:grid;grid-template-columns:48px 1fr;gap:12px;position:relative;cursor:pointer}
.activity.is-wip{background:transparent;box-shadow:inset 0 0 0 2px var(--rule)}
.activity.is-fresh{animation:pulseIn .9s ease-out}
@keyframes pulseIn{0%{transform:scale(.94);box-shadow:0 0 0 0 rgba(215,255,31,.9)}60%{transform:scale(1.01);box-shadow:0 0 0 14px rgba(215,255,31,0)}100%{transform:none}}
.glyph{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#0b0c0a;transform:rotate(-4deg);flex:none}
.activity.is-wip .glyph{filter:grayscale(1);opacity:.55}
.act-main{min-width:0}
.act-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--dust);text-transform:uppercase;letter-spacing:.04em}
.act-title{margin:3px 0 0;font-size:17px;line-height:1.25;font-weight:800;overflow-wrap:anywhere}
.act-note{margin:5px 0 0;color:var(--dust);font-size:14px;overflow-wrap:anywhere}
.act-stat{display:inline-flex;align-items:baseline;gap:6px;margin-top:8px;padding:4px 10px 4px 8px;border-left:4px solid var(--volt);background:var(--lane);border-radius:0 8px 8px 0}
.act-stat .disp{font-size:24px}
.act-stat span{font-size:13px;font-weight:700;color:var(--dust)}
.act-foot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.proof{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;background:var(--volt);color:var(--on-volt);font-size:11px;font-weight:900;letter-spacing:.04em}
.wip-tag{display:inline-flex;padding:2px 7px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--dust);font-size:11px;font-weight:800}
.act-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--volt-ink);text-decoration:none;max-width:60%;min-width:0}
.act-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.props{margin-left:auto;border:0;background:var(--lane);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px;position:relative}
.props.is-hit{animation:propsPop .45s cubic-bezier(.3,1.6,.5,1)}
.props.has{background:var(--volt);color:var(--on-volt)}
@keyframes propsPop{40%{transform:scale(1.25) rotate(-6deg)}}
.blank{margin:0 16px 14px;padding:22px 18px;border-radius:18px;border:2px dashed var(--rule);text-align:center;color:var(--dust);font-weight:600}
.blank .disp{color:var(--chalk);font-size:30px;margin-bottom:6px}

/* ---------- start line (empty) ---------- */
.start-line{margin:0 16px 14px;border-radius:22px;background:var(--chalk);color:var(--asphalt);padding:22px 18px 30px;position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),0 100%)}
@media (prefers-color-scheme: dark){.start-line{background:var(--track);color:var(--chalk);box-shadow:inset 0 0 0 1px var(--rule)}}
.start-line .disp{font-size:52px}
.start-line .disp em{color:var(--volt);font-style:inherit}
.start-line p{font-weight:600;opacity:.85;margin:12px 0 18px}
.checker{height:14px;margin:-22px -18px 18px;background:conic-gradient(var(--volt) 25%,transparent 0 50%,var(--volt) 0 75%,transparent 0) 0 0/14px 14px}

/* ---------- reflection ---------- */
.debrief label{display:block;margin-top:12px}
.debrief label:first-of-type{margin-top:4px}
.debrief span{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dust);margin-bottom:5px}
textarea,input[type=text],input[type=url],input[type=search],input[type=number],input[type=date]{width:100%;min-width:0;background:var(--lane);border:2px solid transparent;border-radius:12px;padding:11px 12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:48px}
textarea{resize:vertical;min-height:64px}
textarea:focus,input:focus{border-color:var(--chalk)}
.saved-flag{font-size:12px;font-weight:800;color:var(--volt-ink);margin-left:auto;opacity:0;transition:opacity .2s}
.saved-flag.on{opacity:1}

/* ---------- log ---------- */
.finder{margin:0 16px 10px;position:relative}
.finder svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dust)}
.finder input{padding-left:40px}
.lanes{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.lanes::-webkit-scrollbar{display:none}
.lane-chip{flex:none;border:0;border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px;background:var(--lane);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lane-chip i{width:10px;height:10px;border-radius:3px;transform:skewX(-14deg);display:inline-block}
.lane-chip.on{background:var(--chalk);color:var(--asphalt)}
.lane-chip small{opacity:.6;font-weight:700}
.toggle3{display:flex;margin:0 16px 12px;background:var(--lane);border-radius:12px;padding:4px}
.toggle3 button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:800;font-size:13px}
.toggle3 button.on{background:var(--track);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.week-bar{display:flex;align-items:center;gap:10px;margin:18px 16px 8px}
.week-bar .disp{font-size:20px}
.week-bar .pill{margin-left:auto;font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px;background:var(--lane);white-space:nowrap}
.week-bar .pill.won{background:var(--volt);color:var(--on-volt)}

/* ---------- stats ---------- */
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 14px}
.score{background:var(--track);border-radius:16px;box-shadow:var(--lift);padding:12px 14px;position:relative;overflow:hidden}
.score .disp{font-size:44px;display:block}
.score small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dust)}
.score.lead{background:var(--volt);color:var(--on-volt)}
.score.lead small{color:inherit;opacity:.7}
.heat-scroll{overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:thin}
.heat-scroll svg{display:block}
.heat-scroll rect.cell{cursor:pointer}
.c0{fill:var(--h0)}.c1{fill:var(--h1)}.c2{fill:var(--h2)}.c3{fill:var(--h3)}.c4{fill:var(--h4)}
.cell.is-picked{stroke:var(--chalk);stroke-width:2}
.axis{fill:var(--dust);font-size:10px;font-weight:700;font-family:var(--body)}
.heat-foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--dust);font-weight:700;flex-wrap:wrap}
.heat-foot .ramp{display:inline-flex;gap:3px;margin-left:auto;align-items:center}
.heat-foot .ramp i{width:11px;height:11px;border-radius:2px;display:inline-block}
.heat-pick{font-weight:800;color:var(--chalk);min-height:1.4em}
.type-rows{display:grid;gap:10px}
.type-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center}
.type-row .glyph{width:28px;height:28px;border-radius:8px}
.type-row .glyph svg{width:18px;height:18px}
.type-row .label{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type-row .bar{grid-column:2/3;height:10px;border-radius:2px;background:var(--lane);transform:skewX(-14deg);overflow:hidden}
.type-row .bar i{display:block;height:100%}
.type-row .n{font-family:var(--display);font-weight:900;font-style:italic;font-size:24px;grid-row:1/3;grid-column:3}
.type-row .label{grid-column:2}
.months svg{display:block;width:100%;height:auto}
.months .bar-s{fill:var(--volt)}
.months .bar-w{fill:var(--rule)}
.months .val{fill:var(--chalk);font-family:var(--display);font-weight:900;font-style:italic;font-size:15px}
.legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--dust);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.trophy-case{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.medal{text-align:center;border:0;background:transparent;padding:0}
.medal svg{width:72px;height:80px;display:block;margin:0 auto}
.medal b{display:block;font-size:12px;font-weight:800;line-height:1.2;margin-top:4px}
.medal small{display:block;font-size:11px;color:var(--dust);line-height:1.25;margin-top:2px}
.medal.is-locked svg{opacity:.28;filter:grayscale(1)}
.medal.is-locked b{color:var(--dust)}

/* ---------- card ---------- */
.poster-frame{margin:0 16px 14px;border-radius:14px;overflow:hidden;box-shadow:var(--lift);background:#000;aspect-ratio:1080/1350}
.poster-frame canvas{width:100%;height:auto;display:block}
.poster-tools{margin:0 16px}
.poster-tools .toggle3{margin:0 0 12px}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:var(--col);z-index:40;background:var(--track);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.dock button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dust);border-radius:12px}
.dock button.on{color:var(--chalk)}
.dock button.on svg{background:var(--volt);color:var(--on-volt);border-radius:8px;transform:skewX(-10deg)}
.dock svg{padding:3px 10px;width:44px;height:28px;box-sizing:border-box}
.ship-it{position:fixed;z-index:41;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:0;background:var(--volt);color:var(--on-volt);height:58px;padding:0 26px 0 20px;border-radius:999px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 28px -6px rgba(0,0,0,.45),0 0 0 4px var(--asphalt)}
.ship-it .disp{font-size:28px;line-height:1}
.ship-it:active{transform:translateX(-50%) scale(.95)}
.ship-it svg{flex:none}
@media (min-width:620px){.ship-it{bottom:calc(88px + env(safe-area-inset-bottom))}}

/* ---------- sheets ---------- */
.veil{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.veil.open{opacity:1}
.drawer{width:100%;max-width:var(--col);max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:var(--track);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s cubic-bezier(.2,.9,.2,1)}
.veil.open .drawer{transform:none}
.drawer-grip{width:44px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 10px}
.drawer-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.drawer-head h2{margin:0;font-size:32px;flex:1}
.x-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--lane);display:grid;place-items:center}
.fieldset{margin-top:14px}
.fieldset>span,.fieldset>label>span{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dust);margin-bottom:6px}
.hint{display:block;font-size:12px;color:var(--dust);margin-top:5px;font-weight:600}
.hint.is-proof{color:var(--volt-ink)}
.err{color:var(--flare);font-size:13px;font-weight:700;margin-top:8px;min-height:1em}
.stance{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stance label{position:relative}
.stance input{position:absolute;opacity:0;pointer-events:none}
.stance label>div{border-radius:12px;padding:10px 12px;background:var(--lane);font-weight:800;font-size:14px;height:100%}
.stance label>div small{display:block;font-weight:600;font-size:12px;color:var(--dust);margin-top:2px}
.stance input:checked+div{background:var(--chalk);color:var(--asphalt)}
.stance input:checked+div small{color:inherit;opacity:.7}
.stance input:focus-visible+div{outline:2px solid var(--volt-ink);outline-offset:2px}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kinds label{position:relative}
.kinds input{position:absolute;opacity:0;pointer-events:none}
.kinds label>div{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:12px;background:var(--lane);font-weight:700;font-size:13px;line-height:1.2;min-height:46px}
.kinds .glyph{width:30px;height:30px;border-radius:9px}
.kinds .glyph svg{width:20px;height:20px}
.kinds input:checked+div{box-shadow:inset 0 0 0 2.5px var(--chalk);background:var(--track)}
.kinds input:focus-visible+div{outline:2px solid var(--volt-ink);outline-offset:2px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px}
.drawer-actions{display:flex;gap:10px;margin-top:18px}
.drawer-actions .go{flex:1}
.drawer-actions .go-flare{flex:0 0 auto}
.goal-dial{display:flex;align-items:center;gap:14px}
.goal-dial .disp{font-size:52px;min-width:56px;text-align:center}
.goal-dial button{width:48px;height:48px;border-radius:14px;border:0;background:var(--lane);font-size:24px;font-weight:900}
.lang-flip{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang-flip button{border:0;border-radius:12px;padding:12px;font-weight:800;background:var(--lane)}
.lang-flip button.on{background:var(--chalk);color:var(--asphalt)}
.stack{display:grid;gap:8px}
.fine{font-size:12px;color:var(--dust);margin-top:14px;line-height:1.5}

.prompt-box{width:100%;max-width:360px;background:var(--track);border-radius:18px;padding:20px;margin:16px;align-self:center;transform:scale(.96);transition:transform .2s}
.veil.open .prompt-box{transform:none}
.prompt-box h3{margin:0 0 8px;font-size:28px}
.prompt-box p{margin:0 0 16px;color:var(--dust);font-weight:600}

/* ---------- toast + confetti ---------- */
.flash{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:80;width:calc(100% - 32px);max-width:400px;background:var(--chalk);color:var(--asphalt);border-radius:14px;padding:12px 14px;font-weight:800;display:flex;gap:12px;align-items:center;transition:transform .35s cubic-bezier(.2,1.3,.4,1);box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}
.flash.show{transform:translate(-50%,0)}
.flash .flash-badge{flex:none;width:40px;height:40px;border-radius:10px;background:var(--volt);color:var(--on-volt);display:grid;place-items:center;transform:skewX(-10deg)}
.flash .flash-badge svg{transform:skewX(10deg)}
.flash small{display:block;font-weight:600;opacity:.75;font-size:13px}
.burst{position:fixed;z-index:79;pointer-events:none;width:10px;height:14px;left:0;top:0;border-radius:2px;animation:burst 1.1s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{0%{transform:translate(var(--x0),var(--y0)) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--x1),var(--y1)) rotate(var(--r)) scale(.7);opacity:0}}
.shock{position:fixed;z-index:78;pointer-events:none;width:40px;height:40px;border-radius:50%;border:4px solid var(--volt);animation:shock .7s ease-out forwards}
@keyframes shock{to{transform:scale(9);opacity:0}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .burst,.shock{display:none}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

<div class="veil" id="veil" hidden><div class="drawer" id="drawer" role="dialog" aria-modal="true"></div></div>

<!-- ===================== CORE (pure logic; tested in node) ===================== -->
<script id="core">
var Core = (function () {
  'use strict';
  var TYPE_KEYS = ['launch', 'feature', 'content', 'outreach', 'customer', 'experiment', 'revenue'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  /* Local calendar date -> 'YYYY-MM-DD'. Never uses toISOString (that would be UTC). */
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  /* Parse at local NOON so DST shifts (which happen near midnight) can never move the calendar day. */
  function parseKey(k) { var p = String(k).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0, 0); }
  function isKey(k) {
    if (typeof k !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(k)) return false;
    var y = +k.slice(0, 4); if (y < 1970 || y > 2100) return false;
    return dateKey(parseKey(k)) === k;
  }
  function todayKey(now) { return dateKey(now || new Date()); }
  function addDays(k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); }
  /* 0 = Monday ... 6 = Sunday */
  function dow(k) { return (parseKey(k).getDay() + 6) % 7; }
  function weekStart(k) { return addDays(k, -dow(k)); }
  function diffDays(a, b) { return Math.round((parseKey(b) - parseKey(a)) / 864e5); }
  function monthKey(k) { return k.slice(0, 7); }
  function addMonths(mk, n) {
    var y = +mk.slice(0, 4), m = +mk.slice(5, 7) - 1 + n;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + '-' + pad(m + 1);
  }
  /* ISO-8601 week number + week-year (week containing Thursday). */
  function isoWeek(k) {
    var thu = addDays(weekStart(k), 3);
    var y = +thu.slice(0, 4);
    var firstThu = addDays(weekStart(y + '-01-04'), 3);
    return { year: y, week: 1 + Math.round(diffDays(firstThu, thu) / 7) };
  }

  function isShipped(s) { return !!s && s.status === 'shipped'; }
  function hasProof(s) { return !!s && /^https?:\/\/[^\s.]+\.[^\s]+/i.test(s.link || ''); }

  function weekCounts(ships) {
    var m = {};
    for (var i = 0; i < ships.length; i++) {
      var s = ships[i];
      if (isShipped(s) && isKey(s.date)) { var w = weekStart(s.date); m[w] = (m[w] || 0) + 1; }
    }
    return m;
  }
  function dayCounts(ships) {
    var m = {};
    ships.forEach(function (s) { if (isShipped(s) && isKey(s.date)) m[s.date] = (m[s.date] || 0) + 1; });
    return m;
  }

  /* Streak = consecutive weeks (Mon-Sun) where shipped count >= goal.
     The current week extends the streak once met; while it is still in progress and unmet
     it does not break the streak (you have until Sunday). Only "shipped" counts. */
  function streakInfo(ships, goal, today) {
    goal = Math.max(1, Math.floor(+goal) || 1);
    var m = weekCounts(ships);
    var cw = weekStart(today);
    var thisCount = m[cw] || 0;
    var met = thisCount >= goal;
    var current = met ? 1 : 0;
    var w = addDays(cw, -7);
    while ((m[w] || 0) >= goal) { current++; w = addDays(w, -7); }
    var keys = Object.keys(m).sort();
    var longest = 0, weeksMet = 0;
    if (keys.length) {
      var run = 0, end = keys[keys.length - 1] > cw ? keys[keys.length - 1] : cw;
      for (w = keys[0]; w <= end; w = addDays(w, 7)) {
        if ((m[w] || 0) >= goal) { run++; weeksMet++; if (run > longest) longest = run; }
        else run = 0;
      }
    }
    if (current > longest) longest = current;
    return { current: current, longest: longest, thisWeek: thisCount, goal: goal, met: met,
             needed: Math.max(0, goal - thisCount), atRisk: !met && current > 0, weeksMet: weeksMet };
  }

  /* Did the founder ever hit goal, miss, then hit goal again? */
  function hasComeback(ships, goal) {
    var m = weekCounts(ships), keys = Object.keys(m).sort();
    if (!keys.length) return false;
    var seenMet = false, missedAfter = false;
    for (var w = keys[0]; w <= keys[keys.length - 1]; w = addDays(w, 7)) {
      var ok = (m[w] || 0) >= goal;
      if (ok && seenMet && missedAfter) return true;
      if (ok) { seenMet = true; missedAfter = false; } else if (seenMet) missedAfter = true;
    }
    return false;
  }

  var MEDALS = [
    { id: 'first', code: '1', test: function (x) { return x.total >= 1; } },
    { id: 'launch', icon: 'launch', test: function (x) { return x.byType.launch >= 1; } },
    { id: 'paid', icon: 'revenue', test: function (x) { return x.byType.revenue >= 1; } },
    { id: 'ten', code: '10', test: function (x) { return x.total >= 10; } },
    { id: 'quarter', code: '25', test: function (x) { return x.total >= 25; } },
    { id: 'fifty', code: '50', test: function (x) { return x.total >= 50; } },
    { id: 'streak4', code: '4W', test: function (x) { return x.longest >= 4; } },
    { id: 'streak8', code: '8W', test: function (x) { return x.longest >= 8; } },
    { id: 'five', code: '5X', test: function (x) { return x.maxWeek >= 5; } },
    { id: 'receipts', icon: 'proof', test: function (x) { return x.proof >= 10; } },
    { id: 'listener', icon: 'customer', test: function (x) { return x.byType.customer >= 5; } },
    { id: 'comeback', icon: 'comeback', test: function (x) { return x.comeback; } }
  ];
  function medalStats(ships, goal, today) {
    var byType = {}; TYPE_KEYS.forEach(function (t) { byType[t] = 0; });
    var total = 0, proof = 0;
    ships.forEach(function (s) { if (isShipped(s)) { total++; byType[s.type] = (byType[s.type] || 0) + 1; if (hasProof(s)) proof++; } });
    var wc = weekCounts(ships), maxWeek = 0;
    Object.keys(wc).forEach(function (k) { if (wc[k] > maxWeek) maxWeek = wc[k]; });
    var si = streakInfo(ships, goal, today);
    return { total: total, byType: byType, proof: proof, maxWeek: maxWeek, longest: si.longest, comeback: hasComeback(ships, Math.max(1, goal | 0)) };
  }
  function earnedMedals(ships, goal, today) {
    var x = medalStats(ships, goal, today);
    return MEDALS.filter(function (m) { return m.test(x); }).map(function (m) { return m.id; });
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function str(v, max) { return typeof v === 'string' ? v.trim().slice(0, max) : ''; }
  function cleanLink(v) {
    v = str(v, 600);
    if (!v) return '';
    if (!/^https?:\/\//i.test(v) && /^[\w-]+(\.[\w-]+)+(\/|$)/.test(v)) v = 'https://' + v;
    return /^https?:\/\/[^\s]+$/i.test(v) ? v : '';
  }
  function sanitizeShip(s, today) {
    if (!s || typeof s !== 'object') return null;
    var title = str(s.title, 140);
    if (!title) return null;
    var mv = s.metricValue === '' || s.metricValue == null ? null : Number(s.metricValue);
    return {
      id: str(s.id, 40) || uid(),
      title: title,
      type: TYPE_KEYS.indexOf(s.type) >= 0 ? s.type : 'feature',
      status: s.status === 'wip' ? 'wip' : 'shipped',
      date: isKey(s.date) ? s.date : (today || todayKey()),
      link: cleanLink(s.link),
      note: str(s.note, 280),
      metricValue: mv != null && isFinite(mv) ? mv : null,
      metricUnit: str(s.metricUnit, 30),
      props: Math.max(0, Math.min(9999, Math.floor(+s.props) || 0)),
      created: +s.created || Date.now()
    };
  }
  function sanitizeState(raw, today) {
    var out = { v: 1, goal: 3, handle: '', ships: [], debriefs: {} };
    if (!raw || typeof raw !== 'object') return out;
    var g = Math.floor(+raw.goal);
    out.goal = g >= 1 && g <= 21 ? g : 3;
    out.handle = str(raw.handle, 32);
    var seen = {};
    (Array.isArray(raw.ships) ? raw.ships : []).forEach(function (s) {
      var c = sanitizeShip(s, today);
      if (c && !seen[c.id]) { seen[c.id] = 1; out.ships.push(c); }
    });
    var d = raw.debriefs && typeof raw.debriefs === 'object' ? raw.debriefs : {};
    Object.keys(d).forEach(function (k) {
      if (isKey(k) && d[k] && typeof d[k] === 'object') {
        out.debriefs[weekStart(k)] = { shipped: str(d[k].shipped, 1000), feedback: str(d[k].feedback, 1000), next: str(d[k].next, 300) };
      }
    });
    return out;
  }

    if (rawLink && !C.cleanLink(rawLink)) { err.textContent = T('errLink'); f.elements['link'].focus(); return; }
    if (!C.isKey(date)) date = today();
    if (date > today()) { err.textContent = T('errFuture'); return; }
    var id = f.getAttribute('data-id'), prev = id ? find(id) : null;
    var before = C.earnedMedals(state.ships, state.goal, today()), siBefore = C.streakInfo(state.ships, state.goal, today());
    var mvRaw = f.elements['metricValue'].value.trim();
    var rec = C.sanitizeShip({
      id: id || C.uid(), title: title, type: (f.querySelector('input[name=type]:checked') || {}).value,
      status: (f.querySelector('input[name=status]:checked') || {}).value, date: date, link: rawLink, note: f.elements['note'].value,
      metricValue: mvRaw === '' ? null : mvRaw, metricUnit: f.elements['metricUnit'].value, props: prev ? prev.props : 0, created: prev ? prev.created : Date.now()
    }, today());
    if (prev) state.ships[state.ships.indexOf(prev)] = rec; else state.ships.push(rec);
    persist(); closeDrawer();
    ui.freshId = rec.id;
    var cw = C.weekStart(today());
    if (!prev) { ui.week = C.weekStart(rec.date); if (ui.tab !== 'log') ui.tab = 'feed'; }
    render();
    var after = C.earnedMedals(state.ships, state.goal, today()), si = C.streakInfo(state.ships, state.goal, today());
    var fresh = after.filter(function (m) { return before.indexOf(m) < 0; });
    if (rec.status === 'shipped' && (!prev || prev.status !== 'shipped')) {
      var inThisWeek = C.weekStart(rec.date) === cw;
      if (inThisWeek && si.met && !siBefore.met) { flash(T('tGoal', si.current), T('tGoalSub'), true); celebrate(true); }
      else { flash(inThisWeek ? T('tShipped', si.thisWeek, si.goal) : T('tSaved'), T('tShippedSub'), true); celebrate(false); }
      buzz();
    } else if (rec.status === 'wip' && !prev) flash(T('tWip'), T('tWipSub'));
    else flash(T('tSaved'));
    if (fresh.length) setTimeout(function () { flash(T('tMedal', T('m_' + fresh[0])), T('md_' + fresh[0]), true, 'medal'); celebrate(true); }, 1900);
  }

  /* ---------------- profile drawer ---------------- */
  function profileDrawer() {
    var html = '<div class="drawer-head"><h2 class="disp">' + esc(T('profile')) + '</h2><button type="button" class="x-btn" data-act="close" aria-label="' + esc(T('cancel')) + '">' + xIcon() + '</button></div>' +
      '<div class="fieldset"><span>' + esc(T('goal')) + '</span><div class="goal-dial"><button data-act="goal" data-v="-1" aria-label="−">−</button><span class="disp" id="goalVal">' + state.goal + '</span><button data-act="goal" data-v="1" aria-label="+">+</button><span class="hint" style="margin:0">' + esc(T('goalUnit')) + '</span></div></div>' +
      '<div class="fieldset"><label><span>' + esc(T('handle')) + '</span><input type="text" id="handleIn" maxlength="32" placeholder="' + esc(T('handlePh')) + '" value="' + esc(state.handle) + '"></label></div>' +
      '<div class="fieldset"><span>' + esc(T('language')) + '</span><div class="lang-flip"><button data-act="lang" data-v="en" class="' + (lang === 'en' ? 'on' : '') + '">English</button><button data-act="lang" data-v="zh" class="' + (lang === 'zh' ? 'on' : '') + '">中文</button></div></div>' +
      '<div class="fieldset"><span>' + esc(T('data')) + '</span><div class="stack">' +
      '<button class="go go-ghost" data-act="export">' + esc(T('exportBtn')) + '</button><button class="go go-ghost" data-act="import">' + esc(T('importBtn')) + '</button>' +
      '<button class="go go-ghost" data-act="demo">' + esc(T('demoBtn')) + '</button><button class="go go-flare" data-act="clear">' + esc(T('clearBtn')) + '</button></div>' +
      '<p class="fine">' + esc(T('dataNote')) + (Store.ok ? '' : ' ' + esc(T('storageWarn'))) + '</p></div>';
    openDrawer(html);
  }

  /* ---------------- confirm prompt ---------------- */
  var pVeil = $('#promptVeil'), pBox = $('#promptBox'), pResolve = null;
  function confirmBox(head, body, go) {
    return new Promise(function (res) {
      pResolve = res;
      pBox.innerHTML = '<h3 class="disp">' + esc(head) + '</h3><p>' + esc(body) + '</p><div class="go-row"><button class="go go-ghost" data-act="pNo">' + esc(T('cancel')) + '</button><button class="go go-ink" data-act="pYes">' + esc(go || T('yes')) + '</button></div>';
      pVeil.hidden = false; requestAnimationFrame(function () { pVeil.classList.add('open'); });
      setTimeout(function () { var b = pBox.querySelector('[data-act=pNo]'); if (b) b.focus(); }, 50);
    });
  }
  function closePrompt(v) { pVeil.classList.remove('open'); setTimeout(function () { pVeil.hidden = true; }, 180); if (pResolve) { var r = pResolve; pResolve = null; r(v); } }

  /* ---------------- feedback: flash, confetti, haptics ---------------- */
  var flashTimer = null;
  function flash(title, sub, hot, kind) {
    var el = $('#flash');
    el.innerHTML = (hot ? '<div class="flash-badge">' + (kind === 'medal' ? glyphSVG('feature', 22, 2.6) : glyphSVG('proof', 22, 3)) + '</div>' : '') + '<div>' + esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>';
    el.classList.add('show'); clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { el.classList.remove('show'); }, hot ? 2400 : 1600);
  }
  function celebrate(big) {
    try { if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
    var btn = $('#shipIt').getBoundingClientRect(), ox = btn.left + btn.width / 2, oy = btn.top;
    var shock = document.createElement('div'); shock.className = 'shock'; shock.style.left = (ox - 20) + 'px'; shock.style.top = (oy - 10) + 'px';
    document.body.appendChild(shock); setTimeout(function () { shock.remove(); }, 800);
    var colors = ['#d7ff1f', '#d7ff1f', '#ff4a3d', '#4dd2ff', '#ff7ae6', '#ffd60a', '#f3f5ec'], count = big ? 70 : 34;
    for (var i = 0; i < count; i++) {
      var p = document.createElement('i'); p.className = 'burst';
      var ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3, dist = 140 + Math.random() * (big ? 380 : 240);
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--x0', ox + 'px'); p.style.setProperty('--y0', oy + 'px');
      p.style.setProperty('--x1', (ox + Math.cos(ang) * dist) + 'px'); p.style.setProperty('--y1', (oy + Math.sin(ang) * dist + 120) + 'px');
      p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      p.style.animationDelay = (Math.random() * 120) + 'ms';
      if (i % 3 === 0) { p.style.width = '8px'; p.style.height = '8px'; p.style.borderRadius = '50%'; }
      document.body.appendChild(p);
      (function (n) { setTimeout(function () { n.remove(); }, 1400); })(p);
    }
  }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate([12, 40, 18]); } catch (e) {} }

  /* ---------------- data actions ---------------- */
  function download(name, blob) {
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
  function doExport() {
    var payload = { app: 'ship-log', version: 1, exportedAt: new Date().toISOString(), data: state };
    download('ship-log-backup-' + today() + '.json', new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
    flash(T('tExported'));
  }
  function doImport(file) {
    var r = new FileReader();
    r.onload = function () {
      var obj = null; try { obj = JSON.parse(String(r.result)); } catch (e) {}
      var data = obj && obj.app === 'ship-log' && obj.data ? obj.data : obj && Array.isArray(obj.ships) ? obj : null;
      if (!data) { flash(T('tImportBad')); return; }
      var clean = C.sanitizeState(data, today());
      confirmBox(T('confirmImpH'), T('confirmImp', clean.ships.length), T('confirmImpGo')).then(function (ok) {
        if (!ok) return; state = clean; persist(); closeDrawer(); ui.week = C.weekStart(today()); render(); flash(T('tImported'));
      });
    };
    r.onerror = function () { flash(T('tImportBad')); };
    r.readAsText(file);
  }
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
      flash(ok ? T('copied') : T('copyFail'), ok ? '' : text.slice(0, 120));
    }
    try {
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { flash(T('copied'), '', true); }, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (e) {
    if (e.target.closest('a[href]')) return;
    var hc = e.target.closest('rect.cell');
    if (hc) {
      document.querySelectorAll('rect.cell.is-picked').forEach(function (r) { r.classList.remove('is-picked'); });
      hc.classList.add('is-picked');
      var hp = $('#heatPick'); if (hp) hp.textContent = T('dayShips', fmtDay(hc.getAttribute('data-k')), +hc.getAttribute('data-n'));
      return;
    }
    if (e.target === veil) { closeDrawer(); return; }
    if (e.target === pVeil) { closePrompt(false); return; }
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
    switch (act) {
      case 'tab':
        ui.tab = el.getAttribute('data-tab'); try { sessionStorage.setItem('shiplog.tab', ui.tab); } catch (er) {}
        render(); window.scrollTo(0, 0); break;
      case 'new': shipForm(null); break;
      case 'edit': var s = find(id); if (s) shipForm(s); break;
      case 'close': closeDrawer(); break;
      case 'props':
        var sp = find(id); if (!sp) break;
        sp.props = Math.min(9999, (sp.props || 0) + 1); persist();
        el.classList.add('has'); el.querySelector('span').textContent = sp.props;
        el.classList.remove('is-hit'); void el.offsetWidth; el.classList.add('is-hit'); buzz(); break;
      case 'wkPrev': ui.week = C.addDays(ui.week, -7); render(); break;
      case 'wkNext': var nx = C.addDays(ui.week, 7); if (nx <= C.weekStart(today())) { ui.week = nx; render(); } break;
      case 'ftype': ui.type = v; render(); break;
      case 'fstatus': ui.status = v; render(); break;
      case 'theme': ui.cardTheme = v; document.querySelectorAll('[data-act=theme]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); }); drawPoster(); break;
      case 'png':
        var cv = $('#poster'); if (!cv) break;
        try { cv.toBlob(function (b) { if (b) download('ship-log-' + ui.week + '.png', b); }, 'image/png'); }
        catch (er) { var a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = 'ship-log-' + ui.week + '.png'; a.click(); }
        break;
      case 'copy': copyText(recapText(ui.week)); break;
      case 'sharefile':
        var cv2 = $('#poster'); if (!cv2) break;
        cv2.toBlob(function (b) {
          if (!b) return;
          var file = new File([b], 'ship-log-' + ui.week + '.png', { type: 'image/png' });
          try { navigator.share({ files: [file], text: recapText(ui.week) }).catch(function () {}); } catch (er) {}
        }, 'image/png');
        break;
      case 'profile': profileDrawer(); break;
      case 'goal':
        state.goal = Math.max(1, Math.min(21, state.goal + (+v))); persist();
        $('#goalVal').textContent = state.goal; render(); break;
      case 'lang':
        lang = v === 'zh' ? 'zh' : 'en'; Store.set(LANG_KEY, lang);
        document.querySelectorAll('[data-act=lang]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === lang); });
        render(); profileDrawer(); break;
      case 'export': doExport(); break;
      case 'import': $('#importFile').click(); break;
      case 'demo':
        var go = function () { state = C.buildDemo(today(), lang); state.handle = state.handle || ''; persist(); closeDrawer(); ui.week = C.weekStart(today()); ui.tab = 'feed'; render(); window.scrollTo(0, 0); flash(T('tDemo'), T('tDemoSub'), true); celebrate(true); };
        if (state.ships.length) confirmBox(T('confirmDemoH'), T('confirmDemo'), T('confirmDemoGo')).then(function (ok) { if (ok) go(); });
        else go();
        break;
      case 'clear':
        confirmBox(T('confirmClearH'), T('confirmClear'), T('confirmClearGo')).then(function (ok) {
          if (!ok) return; state = C.sanitizeState(null); Store.del(KEY); persist(); closeDrawer(); ui.week = C.weekStart(today()); render(); flash(T('tCleared'));
        }); break;
      case 'delete':
        confirmBox(T('confirmDelH'), T('confirmDel'), T('confirmDelGo')).then(function (ok) {
          if (!ok) return; state.ships = state.ships.filter(function (x) { return x.id !== id; }); persist(); closeDrawer(); render(); flash(T('tDeleted'));
        }); break;
      case 'pYes': closePrompt(true); break;
      case 'pNo': closePrompt(false); break;
    }
  });
  document.addEventListener('submit', function (e) { if (e.target.id === 'shipForm') { e.preventDefault(); submitShip(e.target); } });
  var debTimer = null;
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'logSearch') { ui.q = t.value; renderLogList(); return; }
    if (t.name === 'link' && t.form && t.form.id === 'shipForm') { linkHint(); $('#formErr').textContent = ''; return; }
    if (t.name === 'title' && t.form && t.form.id === 'shipForm') { $('#formErr').textContent = ''; return; }
    if (t.id === 'handleIn') { state.handle = t.value.trim().slice(0, 32); persist(); applyCopy(); return; }
    var f = t.getAttribute('data-debrief');
    if (f) {
      var ws = ui.week, d = state.debriefs[ws] || (state.debriefs[ws] = { shipped: '', feedback: '', next: '' });
      d[f] = t.value; clearTimeout(debTimer);
      debTimer = setTimeout(function () {
        if (!d.shipped && !d.feedback && !d.next) delete state.debriefs[ws];
        persist(); var sf = $('#savedFlag'); if (sf) { sf.classList.add('on'); setTimeout(function () { sf.classList.remove('on'); }, 1200); }
      }, 350);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (!pVeil.hidden) closePrompt(false); else if (!veil.hidden) closeDrawer(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('activity')) { e.preventDefault(); var s = find(e.target.getAttribute('data-id')); if (s) shipForm(s); }
  });
  $('#importFile').addEventListener('change', function () { var f = this.files && this.files[0]; if (f) doImport(f); this.value = ''; });
  window.addEventListener('storage', function (e) { if (e.key === KEY) { state = loadState(); render(); } });
  // roll over to the new week if the app stays open past midnight Sunday
  var lastDay = today();
  setInterval(function () { var t = today(); if (t !== lastDay) { if (ui.week === C.weekStart(lastDay)) ui.week = C.weekStart(t); lastDay = t; render(); } }, 60000);

  render();
})();
</script>
</body>
