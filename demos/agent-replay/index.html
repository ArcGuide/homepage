<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Replay — Screening Room</title>
<meta name="description" content="Cut a replay of any agent run: program monitor, multi-track timeline, inspector. Runs entirely in your browser.">
<style>
:root{
  color-scheme: light;
  --bg:#e9e8e3; --deck:#f4f3ef; --deck-2:#fbfaf7; --deck-3:#e2e0d9; --well:#ffffff;
  --seam:#d3d0c7; --seam-2:#c2beb3;
  --ink:#1d1e22; --ink-2:#4f525b; --ink-3:#7c7f88;
  --tally:#4d7a00; --tally-ink:#ffffff; --tally-soft:rgba(77,122,0,.12);
  --ph:#d6331f;
  --v-msg:#2a78d6; --v-think:#eda100; --v-call:#eb6834; --v-res:#1baf7a; --v-err:#d03b3b; --v-user:#5a6170; --v-sys:#9a9ea8;
  --wave-up:#eb6834; --wave-dn:#2a78d6;
  --tok-i:#2a78d6; --tok-o:#eb6834; --tok-cr:#1baf7a; --tok-cw:#c98500;
  --term-bg:#16181d; --term-ink:#d9dde4; --term-dim:#8b919c;
  --add-bg:rgba(27,175,122,.14); --add-ink:#0b6b49; --del-bg:rgba(208,59,59,.12); --del-ink:#a32626;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 1px 2px rgba(0,0,0,.06);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#08090b; --deck:#121317; --deck-2:#181a1f; --deck-3:#20232a; --well:#0b0c0f;
    --seam:#262a32; --seam-2:#343944;
    --ink:#e7e8ec; --ink-2:#a3a8b3; --ink-3:#6b717d;
    --tally:#c6f432; --tally-ink:#11140a; --tally-soft:rgba(198,244,50,.10);
    --ph:#ff4b3a;
    --v-msg:#3987e5; --v-think:#c98500; --v-call:#d95926; --v-res:#199e70; --v-err:#e0453f; --v-user:#8a93a6; --v-sys:#555b67;
    --wave-up:#d95926; --wave-dn:#3987e5;
    --tok-i:#3987e5; --tok-o:#d95926; --tok-cr:#199e70; --tok-cw:#c98500;
    --term-bg:#050607; --term-ink:#d4d8df; --term-dim:#7b818c;
    --add-bg:rgba(25,158,112,.16); --add-ink:#6fdcb0; --del-bg:rgba(224,69,63,.15); --del-ink:#ff9b95;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#08090b; --deck:#121317; --deck-2:#181a1f; --deck-3:#20232a; --well:#0b0c0f;
  --seam:#262a32; --seam-2:#343944;
  --ink:#e7e8ec; --ink-2:#a3a8b3; --ink-3:#6b717d;
  --tally:#c6f432; --tally-ink:#11140a; --tally-soft:rgba(198,244,50,.10);
  --ph:#ff4b3a;
  --v-msg:#3987e5; --v-think:#c98500; --v-call:#d95926; --v-res:#199e70; --v-err:#e0453f; --v-user:#8a93a6; --v-sys:#555b67;
  --wave-up:#d95926; --wave-dn:#3987e5;
  --tok-i:#3987e5; --tok-o:#d95926; --tok-cr:#199e70; --tok-cw:#c98500;
  --term-bg:#050607; --term-ink:#d4d8df; --term-dim:#7b818c;
  --add-bg:rgba(25,158,112,.16); --add-ink:#6fdcb0; --del-bg:rgba(224,69,63,.15); --del-ink:#ff9b95;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:12.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono,.tc{font-family:var(--mono);font-variant-numeric:tabular-nums}
kbd{font:600 10.5px var(--mono);padding:1px 5px;border:1px solid var(--seam-2);border-bottom-width:2px;border-radius:4px;background:var(--deck-2);color:var(--ink-2)}

/* ── suite frame ── */
.suite{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:32px auto minmax(0,1fr) auto;height:100vh;height:100dvh}
.menubar{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--deck);border-bottom:1px solid var(--seam);position:relative;z-index:30;user-select:none}
.marque{display:flex;align-items:center;gap:8px;margin-right:10px;font:700 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.reel-glyph{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);position:relative;flex:none}
.reel-glyph::before{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 50% 18%,var(--ink) 1.3px,transparent 1.6px),radial-gradient(circle at 18% 70%,var(--ink) 1.3px,transparent 1.6px),radial-gradient(circle at 82% 70%,var(--ink) 1.3px,transparent 1.6px)}
.reel-glyph::after{content:"";position:absolute;right:-6px;bottom:-2px;width:7px;height:2px;background:var(--tally);border-radius:1px}
.menu{position:relative}
.menu-title{background:none;border:0;padding:5px 9px;border-radius:5px;color:var(--ink-2)}
.menu-title:hover,.menu.open .menu-title{background:var(--deck-3);color:var(--ink)}
.menu-pop{display:none;position:absolute;left:0;top:calc(100% + 3px);min-width:250px;padding:5px;background:var(--deck-2);border:1px solid var(--seam-2);border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.menu.open>.menu-pop{display:block}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:5px;color:var(--ink);position:relative;white-space:nowrap}
.mi:hover,.mi:focus-visible,.sub.open>.mi{background:var(--tally);color:var(--tally-ink);outline:none}
.mi:disabled{opacity:.4;pointer-events:none}
.mi .ks{margin-left:auto;font:11px var(--mono);opacity:.65}
.mi .chk{width:12px;font-family:var(--mono)}
.mi .arrow{margin-left:auto;opacity:.7}
.menu-sep{height:1px;background:var(--seam);margin:5px 4px}
.sub{position:relative}
.sub-pop{display:none;position:absolute;left:calc(100% - 4px);top:-5px;min-width:170px;padding:5px;background:var(--deck-2);border:1px solid var(--seam-2);border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.sub.open>.sub-pop{display:block}
@media (hover:hover){.sub:hover>.sub-pop{display:block}}
.menubar .spacer{flex:1}
.local-lamp{display:flex;align-items:center;gap:7px;font:11px var(--mono);color:var(--ink-2);white-space:nowrap;padding:0 4px}
.local-lamp i{width:7px;height:7px;border-radius:50%;background:var(--tally);box-shadow:0 0 8px var(--tally)}
.drawer-btn{display:none;background:var(--deck-3);border:1px solid var(--seam);border-radius:5px;padding:3px 8px;font:11px var(--mono);color:var(--ink-2);margin-left:4px}

/* ── slate strip (run identity) ── */
.slate-strip{display:flex;align-items:center;gap:14px;padding:6px 12px;background:var(--deck-2);border-bottom:1px solid var(--seam);min-width:0;overflow:hidden}
.clap{flex:none;width:30px;height:20px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--ink) 0 5px,var(--deck-2) 5px 10px);border:1px solid var(--ink);opacity:.85}
.clip-name{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.slate-fields{display:flex;gap:16px;flex:none;font:11px var(--mono);color:var(--ink-3)}
.slate-fields b{color:var(--ink);font-weight:600;margin-left:5px}
.ribbon{font:10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--tally-soft);color:var(--ink);border:1px solid var(--seam-2)}

/* ── bay ── */
.bay{display:grid;grid-template-columns:250px minmax(0,1fr) 296px;min-height:0}
.panel{background:var(--deck);display:flex;flex-direction:column;min-height:0;min-width:0}
.panel-head{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-bottom:1px solid var(--seam);font:650 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);flex:none}
.panel-head .grow{flex:1}
.bin{border-right:1px solid var(--seam)}
.inspector{border-left:1px solid var(--seam)}
.bin-tabs{display:flex;gap:2px}
.bin-tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 6px 5px;font:inherit;letter-spacing:inherit;color:var(--ink-3);text-transform:inherit}
.bin-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tally)}
.bin-find{margin:8px 8px 4px;padding:6px 8px;background:var(--well);border:1px solid var(--seam);border-radius:5px;outline:none}
.bin-find:focus{border-color:var(--tally)}
.bin-kinds{display:flex;flex-wrap:wrap;gap:4px;padding:2px 8px 8px}
.kind-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border:1px solid var(--seam);border-radius:999px;background:none;font:10.5px var(--mono);color:var(--ink-2)}
.kind-chip[aria-pressed="false"]{opacity:.45}
.kind-chip i,.sw{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.bin-scroll{flex:1;overflow:auto;position:relative;min-height:0;border-top:1px solid var(--seam)}
.bin-rows{position:relative}
.bin-row{position:absolute;left:0;right:0;height:26px;display:flex;align-items:center;gap:7px;padding:0 8px 0 0;cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--seam) 55%,transparent)}
.bin-row:hover{background:var(--deck-3)}
.bin-row.is-live{background:var(--tally-soft);box-shadow:inset 3px 0 0 var(--tally)}
.bin-row .bar{width:3px;align-self:stretch;flex:none}
.bin-row .tc{font-size:10.5px;color:var(--ink-3);flex:none;width:58px}
.bin-row .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.bin-row .lbl b{font-weight:600}
.bin-row .x{color:var(--v-err);font:700 11px var(--mono)}
.tool-roster{flex:1;overflow:auto;padding:6px 8px 12px}
.tool-line{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.tool-line:hover{background:var(--deck-3);border-color:var(--seam)}
.tool-line .nm{font:600 12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-line .ct{font:12px var(--mono);font-variant-numeric:tabular-nums}
.tool-line .meter{grid-column:1/-1;height:4px;background:var(--deck-3);border-radius:2px;overflow:hidden}
.tool-line .meter i{display:block;height:100%;background:var(--v-call);border-radius:2px}
.tool-line .sub-info{grid-column:1/-1;font:10.5px var(--mono);color:var(--ink-3)}

/* ── program monitor ── */
.monitor{background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0;padding:10px 12px 0}
.monitor-frame{position:relative;flex:1;min-height:0;background:var(--well);border:1px solid var(--seam-2);border-radius:6px;overflow:hidden;box-shadow:0 0 0 4px var(--deck), 0 0 0 5px var(--seam)}
.burn{position:absolute;z-index:3;font:600 10.5px var(--mono);letter-spacing:.08em;padding:3px 7px;border-radius:3px;background:rgba(0,0,0,.62);color:#e9eaee;pointer-events:none}
.burn.tl{left:8px;top:5px}
.burn.tr{right:8px;top:5px}
.mon-strip{position:absolute;left:0;right:0;top:0;height:30px;background:var(--deck);border-bottom:1px solid var(--seam);z-index:2}
.mon-strip .live-lbl{position:absolute;left:50%;top:0;transform:translateX(-50%);line-height:30px;font:11px var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.burn .rec{display:inline-block;width:7px;height:7px;border-radius:50%;background:#666;margin-right:6px;vertical-align:0}
.burn.on-air .rec{background:#ff3b30;box-shadow:0 0 8px #ff3b30}
.corner{position:absolute;width:14px;height:14px;border-color:var(--seam-2);border-style:solid;z-index:2;pointer-events:none}
.corner.a{left:6px;top:36px;border-width:1px 0 0 1px}.corner.b{right:6px;top:36px;border-width:1px 1px 0 0}.corner.c{left:6px;bottom:6px;border-width:0 0 1px 1px}.corner.d{right:6px;bottom:6px;border-width:0 1px 1px 0}
.screen{position:absolute;inset:30px 0 0 0;overflow:auto;padding:22px 22px 26px;scroll-behavior:auto}
.feed-head{font:11px var(--mono);color:var(--ink-3);text-align:center;padding:4px 0 14px}
.shot{max-width:860px;margin:0 auto 12px;border-radius:7px;position:relative;animation:cutIn .22s ease-out}
@keyframes cutIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.shot.is-live{box-shadow:0 0 0 1.5px var(--tally), 0 0 22px var(--tally-soft)}
.shot .slug{display:flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--ink-3);padding:7px 11px 0}
.slug .who{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.slug .tcode{margin-left:auto}
.slug .dur{color:var(--ink-3)}
.shot--user{background:var(--deck-3);border:1px solid var(--seam)}
.shot--assistant{background:var(--deck-2);border:1px solid var(--seam)}
.shot--assistant .slug .who{color:var(--v-msg)}
.shot--thought{background:transparent;border:1px dashed var(--seam-2)}
.shot--thought .slug .who{color:var(--v-think)}
.shot--thought .copy{font-style:italic;color:var(--ink-2)}
.shot--system{background:transparent;border:1px solid var(--seam)}
.shot--system .copy{color:var(--ink-3);font-size:11.5px}
.copy{padding:6px 12px 11px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.copy code{font-family:var(--mono);font-size:.92em;background:var(--deck-3);padding:0 4px;border-radius:3px}
.caret{display:inline-block;width:7px;height:14px;background:var(--tally);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.shot--call{background:var(--deck-2);border:1px solid var(--seam);overflow:hidden}
.shot--call .slug{padding:8px 11px;border-bottom:1px solid var(--seam);background:var(--deck)}
.slug .tool{font-weight:700;color:var(--ink);letter-spacing:0;text-transform:none}
.slug .arg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--ink-2)}
.slug .chip{width:8px;height:8px;border-radius:2px;background:var(--v-call);flex:none}
.retake{font:700 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--v-think);color:var(--v-think)}
.cut-body{padding:10px 11px}
.note{font-size:11.5px;color:var(--ink-3);margin:0 0 6px}
.term{margin:0;background:var(--term-bg);color:var(--term-ink);font:12px/1.5 var(--mono);padding:10px 12px;border-radius:5px;white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:none}
.term .ps{color:var(--tally);user-select:none}
.term.out{color:var(--term-dim)}
.term.out.bad{color:#ff9b95}
.path{font:12px var(--mono);color:var(--ink);background:var(--deck-3);padding:2px 7px;border-radius:4px;display:inline-block;margin-bottom:7px;word-break:break-all}
.diff{margin:0;font:12px/1.5 var(--mono);border:1px solid var(--seam);border-radius:5px;overflow:auto;background:var(--well)}
.diff div{white-space:pre-wrap;word-break:break-word;padding:0 10px 0 26px;position:relative}
.diff div::before{position:absolute;left:9px;opacity:.8}
.diff .add{background:var(--add-bg);color:var(--add-ink)}.diff .add::before{content:"+"}
.diff .del{background:var(--del-bg);color:var(--del-ink)}.diff .del::before{content:"−"}
.diff .ctx{color:var(--ink-2)}
.diff .gap{color:var(--ink-3);text-align:center;padding:0}
.take{border-top:1px solid var(--seam);padding:9px 11px 11px;background:var(--deck)}
.take-tag{font:700 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--v-res);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.take.bad{background:color-mix(in srgb,var(--v-err) 7%,var(--deck))}
.take.bad .take-tag{color:var(--v-err)}
.rolling{font:11px var(--mono);color:var(--ink-3);display:flex;align-items:center;gap:8px}
.rolling i{width:8px;height:8px;border-radius:50%;background:var(--ph);animation:blink 1s steps(2) infinite}
.collapsed-read{display:flex;align-items:center;gap:10px;font:12px var(--mono);color:var(--ink-2)}
.pre-plain{margin:0;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--ink-2);max-height:none}
.more{margin-top:7px;background:var(--deck-3);border:1px solid var(--seam);border-radius:4px;padding:3px 9px;font:11px var(--mono);color:var(--ink-2)}
.more:hover{border-color:var(--tally);color:var(--ink)}
.todos{list-style:none;margin:0;padding:0;font-size:12.5px}
.todos li{display:flex;gap:8px;padding:2px 0}
.todos .st{font-family:var(--mono);width:16px;color:var(--ink-3)}
.todos .done{color:var(--ink-3);text-decoration:line-through}
.todos .doing .st{color:var(--tally)}
.shot--err{border:1px solid var(--v-err);background:color-mix(in srgb,var(--v-err) 8%,var(--deck-2))}
.shot--err .slug .who{color:var(--v-err)}

/* slate (empty state) */
.slate{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;z-index:4;background:var(--well)}
.slate[hidden]{display:none}
.slate-card{max-width:560px}
.slate-bars{height:14px;border-radius:3px 3px 0 0;background:repeating-linear-gradient(135deg,var(--ink) 0 14px,var(--well) 14px 28px);border:1.5px solid var(--ink);border-bottom:0;margin:0 auto;width:220px;transform:rotate(-4deg);transform-origin:left bottom}
.slate-board{border:1.5px solid var(--ink);border-radius:0 0 4px 4px;width:220px;margin:0 auto 20px;display:grid;grid-template-columns:1fr 1fr;font:10px var(--mono);text-transform:uppercase;letter-spacing:.1em;text-align:left}
.slate-board div{padding:5px 8px;border-top:1px solid var(--seam-2)}
.slate-board div:nth-child(odd){border-right:1px solid var(--seam-2)}
.slate-board b{display:block;font-size:13px;letter-spacing:.02em;color:var(--ink)}
.slate h2{margin:0 0 8px;font-size:20px;letter-spacing:-.01em}
.slate p{margin:0 auto 16px;color:var(--ink-2);max-width:470px}
.slate-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--seam-2);background:var(--deck-2);border-radius:6px;padding:7px 13px;font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn.go{background:var(--tally);color:var(--tally-ink);border-color:transparent}
.slate small{display:block;margin-top:14px;font:11px var(--mono);color:var(--ink-3)}
.dropping .monitor-frame{box-shadow:0 0 0 4px var(--deck), 0 0 0 6px var(--tally)}

/* transport */
.transport{display:flex;align-items:center;gap:10px;padding:10px 2px 10px;flex-wrap:wrap}
.tcode-big{font:600 22px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--tally);background:var(--well);border:1px solid var(--seam);padding:5px 9px;border-radius:5px;min-width:150px;text-align:center}
.tcode-sub{font:10.5px var(--mono);color:var(--ink-3);line-height:1.35;min-width:96px}
.tcode-sub b{color:var(--ink-2);font-weight:600}
.deck-btns{display:flex;gap:3px}
.tbtn{width:34px;height:30px;border:1px solid var(--seam);background:var(--deck-2);border-radius:5px;display:grid;place-items:center;color:var(--ink)}
.tbtn:hover{border-color:var(--ink-3)}
.tbtn.play{width:44px;background:var(--tally);color:var(--tally-ink);border-color:transparent}
.tbtn svg{width:14px;height:14px;fill:currentColor}
.tbtn.mark.on{border-color:var(--tally);color:var(--tally)}
.tbtn.mark{font:700 11px var(--mono)}
.speed{height:30px;border:1px solid var(--seam);background:var(--deck-2);border-radius:5px;padding:0 6px;font:12px var(--mono)}
.scrub{flex:1;min-width:140px;accent-color:var(--tally)}
.scrub-wrap{flex:1;display:flex;align-items:center;gap:8px;min-width:160px}

/* ── timeline ── */
.timeline{background:var(--deck);border-top:1px solid var(--seam);display:flex;flex-direction:column;min-width:0}
.tl-bar{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-bottom:1px solid var(--seam);font:11px var(--mono);color:var(--ink-3);overflow:hidden;white-space:nowrap}
.tl-bar .ttl{font-weight:650;letter-spacing:.12em;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--seam);border-radius:5px;overflow:hidden}
.seg button{background:none;border:0;padding:3px 8px;font:11px var(--mono);color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--deck-3);color:var(--ink)}
.zoom-btn{background:var(--deck-2);border:1px solid var(--seam);border-radius:4px;width:24px;height:22px;font:12px var(--mono);color:var(--ink-2);padding:0}
.zoom-btn.wide{width:auto;padding:0 7px}
.keys{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--ink-3);font-size:10.5px}
.keys span{display:inline-flex;gap:4px;align-items:center}
.tl-body{display:grid;grid-template-columns:118px minmax(0,1fr);position:relative}
.track-heads{border-right:1px solid var(--seam);background:var(--deck)}
.track-head{display:flex;align-items:center;gap:7px;padding:0 9px;font:10.5px var(--mono);color:var(--ink-2);border-bottom:1px solid var(--seam);white-space:nowrap;overflow:hidden}
.track-head .id{font-weight:700;color:var(--ink-3);width:24px}
.track-head.ruler-h{color:var(--ink-3)}
.tl-canvas-wrap{position:relative;min-width:0;cursor:crosshair}
#tl{display:block;width:100%}
.tl-tip{position:fixed;z-index:50;pointer-events:none;background:var(--deck-2);border:1px solid var(--seam-2);border-radius:6px;padding:6px 9px;font:11px var(--mono);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:340px;white-space:pre-wrap;display:none}

/* ── inspector ── */
.insp-scroll{overflow:auto;flex:1;min-height:0;padding:10px 12px 18px}
.insp-sec{margin-bottom:16px}
.insp-sec h3{margin:0 0 8px;font:650 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.insp-sec h3 .hint{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:400}
.sheet{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{background:var(--deck-2);border:1px solid var(--seam);border-radius:6px;padding:7px 9px;box-shadow:var(--shadow)}
.tile .k{font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font:600 17px var(--mono);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.bad{color:var(--v-err)}
.tile .s{font:10.5px var(--mono);color:var(--ink-3)}
.vitals{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font:11px var(--mono);color:var(--ink-2);margin-top:8px}
.vitals b{color:var(--ink);font-weight:600;text-align:right}
.levels{position:relative}
.level-row{display:grid;grid-template-columns:1fr auto;align-items:end;margin-bottom:2px;font:10.5px var(--mono);color:var(--ink-2)}
.level-row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.level-row span{display:flex;align-items:center;gap:6px}
#levels{display:block;width:100%;height:176px;cursor:crosshair}
.lv-tip{position:absolute;pointer-events:none;background:var(--deck-2);border:1px solid var(--seam-2);border-radius:6px;padding:6px 8px;font:10.5px var(--mono);display:none;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:5}
.cue{display:block;width:100%;text-align:left;background:var(--deck-2);border:1px solid var(--seam);border-radius:6px;padding:7px 9px;margin-bottom:6px}
.cue:hover{border-color:var(--ink-3)}
.cue .top{display:flex;gap:8px;align-items:baseline;font:11px var(--mono)}
.cue .top b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cue .top .tc{margin-left:auto;color:var(--ink-3);flex:none}
.cue .msg{font:11px var(--mono);color:var(--del-ink);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.cue .next{font-size:11.5px;color:var(--ink-2);margin-top:5px;padding-top:5px;border-top:1px dashed var(--seam);word-break:break-word}
.cue .next em{font:normal 600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.cue.err{border-left:3px solid var(--v-err)}
.take-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--seam);padding:6px 2px;font:11px var(--mono)}
.take-row:hover{background:var(--deck-2)}
.take-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.take-row .d{font-weight:650;font-variant-numeric:tabular-nums}
.quiet{color:var(--ink-3);font-size:11.5px}

/* ingest + render overlays */
.strip-progress{position:fixed;left:0;right:0;top:0;height:3px;z-index:90;pointer-events:none;display:none}
.strip-progress i{display:block;height:100%;width:0;background:var(--tally);box-shadow:0 0 10px var(--tally);transition:width .15s}
.render-q{position:fixed;right:16px;bottom:16px;z-index:80;width:320px;background:var(--deck-2);border:1px solid var(--seam-2);border-radius:8px;padding:11px 13px;box-shadow:0 18px 50px rgba(0,0,0,.4);display:none}
.render-q.show{display:block;animation:cutIn .2s ease-out}
.render-q .rq-t{font:600 12px var(--mono);display:flex;justify-content:space-between;gap:8px}
.render-q .rq-s{font:11px var(--mono);color:var(--ink-3);margin-top:3px;word-break:break-all}
.rq-track{height:6px;border-radius:3px;background:var(--deck-3);margin-top:9px;overflow:hidden;position:relative}
.rq-track i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(135deg,var(--tally) 0 8px,color-mix(in srgb,var(--tally) 70%,transparent) 8px 16px);background-size:22px 22px;animation:barber .6s linear infinite;transition:width .18s ease-out}
@keyframes barber{to{background-position:22px 0}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font:12px var(--mono);display:none;max-width:90vw}
.toast.show{display:block;animation:cutIn .2s}

dialog{border:1px solid var(--seam-2);border-radius:10px;background:var(--deck-2);color:var(--ink);padding:0;width:min(680px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-head{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--seam);font:650 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.dlg-head button{margin-left:auto;background:none;border:0;font-size:16px;color:var(--ink-3)}
.dlg-body{padding:14px;max-height:70vh;overflow:auto}
.dlg-body h4{margin:14px 0 6px;font-size:13px}
.dlg-body h4:first-child{margin-top:0}
.dlg-body p{margin:0 0 8px;color:var(--ink-2)}
.dlg-body pre{margin:0 0 8px;background:var(--term-bg);color:var(--term-ink);padding:10px 12px;border-radius:6px;font:11.5px/1.5 var(--mono);overflow:auto}
.dlg-body textarea{width:100%;height:240px;background:var(--well);border:1px solid var(--seam);border-radius:6px;padding:10px;font:11.5px var(--mono);resize:vertical}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 14px 14px}
.keymap{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}

.scrim{display:none}
/* ── narrower suites: inspector into a drawer ── */
@media (max-width:1180px){
  .bay{grid-template-columns:230px minmax(0,1fr)}
  .inspector{position:fixed;right:0;top:32px;bottom:0;width:min(330px,92vw);z-index:40;transform:translateX(102%);transition:transform .2s ease;box-shadow:-20px 0 50px rgba(0,0,0,.35)}
  .suite.show-insp .inspector{transform:none}
  .drawer-btn.for-insp{display:inline-block}
  .suite.show-insp .scrim,.suite.show-bin .scrim{display:block;position:fixed;inset:32px 0 0;background:rgba(0,0,0,.4);z-index:35}
}
/* ── phones: monitor + timeline, bins in drawers ── */
@media (max-width:820px){
  body{overflow:auto}
  .suite{height:auto;min-height:100dvh;grid-template-rows:auto auto auto auto;align-content:start}
  .menubar{position:sticky;top:0;height:40px;padding:0 6px}
  .marque span.wordmark{display:none}
  .local-lamp span{display:none}
  .menu-title{padding:6px 7px}
  .menu-pop{position:fixed;left:8px;right:8px;top:44px;min-width:0}
  .sub-pop{position:static;box-shadow:none;border:0;padding:0 0 0 14px;background:none}
  .bay{display:block}
  .bin{position:fixed;left:0;top:40px;bottom:0;width:min(320px,88vw);z-index:40;transform:translateX(-102%);transition:transform .2s ease;box-shadow:20px 0 50px rgba(0,0,0,.35)}
  .inspector{top:40px}
  .suite.show-bin .bin{transform:none}
  .suite.show-insp .scrim,.suite.show-bin .scrim{inset:40px 0 0}
  .drawer-btn{display:inline-block}
  .slate-strip{flex-wrap:wrap;gap:6px 12px;padding:8px 12px}
  .clip-name{flex-basis:calc(100% - 50px)}
  .slate-fields{flex-wrap:wrap;gap:4px 12px}
  .monitor{padding:10px 10px 0}
  .monitor-frame{height:62vh;flex:none}
  .screen{padding:16px 10px 20px}
  .mon-strip .live-lbl{display:none}
  .tcode-sub{min-width:0;flex:none}
  .marque{margin-right:2px}
  .local-lamp{padding:0 2px}
  .copy{font-size:13.5px}
  .transport{gap:8px}
  .tcode-big{font-size:19px;min-width:0;flex:1 1 150px}
  .deck-btns .tbtn{width:38px}
  .slate-strip .slate-fields{font-size:10.5px;flex:1 1 100%}
  .scrub-wrap{flex-basis:100%;order:5}
  .keys{display:none}
  .tl-body{grid-template-columns:64px minmax(0,1fr)}
  .track-head .nm{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="suite" id="suite">
  <nav class="menubar" id="menubar" aria-label="Menu">
    <div class="marque"><span class="reel-glyph" aria-hidden="true"></span><span class="wordmark" data-i="brand"></span></div>
    <div class="menu" data-menu>
      <button class="menu-title" data-i="m_file" aria-haspopup="true"></button>
      <div class="menu-pop" role="menu">
        <button class="mi" data-act="open"><span class="chk"></span><span data-i="mi_open"></span><span class="ks">⌘O</span></button>
        <button class="mi" data-act="paste"><span class="chk"></span><span data-i="mi_paste"></span></button>
        <button class="mi" data-act="sample"><span class="chk"></span><span data-i="mi_sample"></span></button>
        <div class="menu-sep"></div>
        <button class="mi" data-act="eject"><span class="chk"></span><span data-i="mi_eject"></span></button>
      </div>
    </div>
    <div class="menu" data-menu>
      <button class="menu-title" data-i="m_render" aria-haspopup="true"></button>
      <div class="menu-pop" role="menu">
        <button class="mi" data-act="render" data-needs-run><span class="chk"></span><span data-i="mi_render"></span><span class="ks">⇧R</span></button>
        <button class="mi" data-act="notes" data-needs-run><span class="chk"></span><span data-i="mi_notes"></span></button>
      </div>
    </div>
    <div class="menu" data-menu>
      <button class="menu-title" data-i="m_view" aria-haspopup="true"></button>
      <div class="menu-pop" role="menu">
        <div class="sub" data-sub>
          <button class="mi" data-subopen><span class="chk"></span><span data-i="mi_lang"></span><span class="arrow">▸</span></button>
          <div class="sub-pop">
            <button class="mi" data-lang="en"><span class="chk"></span>English</button>
            <button class="mi" data-lang="zh"><span class="chk"></span>中文</button>
          </div>
        </div>
        <div class="sub" data-sub>
          <button class="mi" data-subopen><span class="chk"></span><span data-i="mi_look"></span><span class="arrow">▸</span></button>
          <div class="sub-pop">
            <button class="mi" data-theme-pick="system"><span class="chk"></span><span data-i="look_sys"></span></button>
            <button class="mi" data-theme-pick="dark"><span class="chk"></span><span data-i="look_dark"></span></button>
            <button class="mi" data-theme-pick="light"><span class="chk"></span><span data-i="look_light"></span></button>
          </div>
        </div>
        <div class="menu-sep"></div>
        <button class="mi" data-act="axis-wall"><span class="chk"></span><span data-i="mi_axis_wall"></span></button>
        <button class="mi" data-act="axis-step"><span class="chk"></span><span data-i="mi_axis_step"></span></button>
        <button class="mi" data-act="fit"><span class="chk"></span><span data-i="mi_fit"></span><span class="ks">F</span></button>
      </div>
    </div>
    <div class="menu" data-menu>
      <button class="menu-title" data-i="m_help" aria-haspopup="true"></button>
      <div class="menu-pop" role="menu">
        <button class="mi" data-act="formats"><span class="chk"></span><span data-i="mi_formats"></span></button>
        <button class="mi" data-act="keys"><span class="chk"></span><span data-i="mi_keys"></span><span class="ks">?</span></button>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="local-lamp" title=""><i></i><span data-i="local"></span></div>
    <button class="drawer-btn for-bin" data-drawer="bin" data-i="d_bin"></button>
    <button class="drawer-btn for-insp" data-drawer="insp" data-i="d_insp"></button>
  </nav>

  <header class="slate-strip">
    <span class="clap" aria-hidden="true"></span>
    <div class="clip-name" id="clipName"></div>
    <div class="slate-fields" id="slateFields"></div>
  </header>

  <main class="bay">
    <aside class="panel bin" id="bin">
      <div class="panel-head"><span data-i="bin"></span><span class="grow"></span>
        <div class="bin-tabs" role="tablist">
          <button class="bin-tab" role="tab" aria-selected="true" data-tab="shots" data-i="tab_shots"></button>
          <button class="bin-tab" role="tab" aria-selected="false" data-tab="tools" data-i="tab_tools"></button>
        </div>
      </div>
      <div id="paneShots" style="display:flex;flex-direction:column;min-height:0;flex:1">
        <input class="bin-find" id="binFind" type="search" autocomplete="off" spellcheck="false">
        <div class="bin-kinds" id="binKinds"></div>
        <div class="bin-scroll" id="binScroll"><div class="bin-rows" id="binRows"></div></div>
      </div>

        <div class="burn tl" id="burnTL"><span class="rec"></span><span data-i="pgm"></span></div>
        <div class="burn tr mono" id="burnTR">00:00:00:00</div>

        <div class="slate" id="slate">
          <div class="slate-card">

            <div class="slate-board">
              <div><span data-i="sl_prod"></span><b data-i="sl_prod_v"></b></div>
              <div><span data-i="sl_roll"></span><b>A001</b></div>
              <div><span data-i="sl_scene"></span><b>—</b></div>
              <div><span data-i="sl_take"></span><b>1</b></div>
            </div>
            <h2 data-i="empty_h"></h2>
            <p data-i="empty_p"></p>
            <div class="slate-actions">
              <button class="btn go" data-act="sample" data-i="mi_sample"></button>
              <button class="btn" data-act="open" data-i="mi_open"></button>
              <button class="btn" data-act="paste" data-i="mi_paste"></button>
            </div>
            <small data-i="local_long"></small>
          </div>
        </div>
      </div>
      <div class="transport" id="transport">
        <div class="tcode-big" id="tcBig">00:00:00:00</div>
        <div class="tcode-sub" id="tcSub"></div>
        <div class="deck-btns">
          <button class="tbtn" data-act="home" data-ti="t_home"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
          <button class="tbtn" data-act="back" data-ti="t_back"><svg viewBox="0 0 16 16"><path d="M12 2v12L4 8zM2 2h2v12H2z" transform="translate(1 0)"/></svg></button>
          <button class="tbtn play" data-act="toggle" id="playBtn" data-ti="t_play"><svg viewBox="0 0 16 16" id="playIco"><path d="M4 2l10 6-10 6z"/></svg></button>
          <button class="tbtn" data-act="fwd" data-ti="t_fwd"><svg viewBox="0 0 16 16"><path d="M4 2v12l8-6zM12 2h2v12h-2z" transform="translate(-1 0)"/></svg></button>
          <button class="tbtn" data-act="end" data-ti="t_end"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
        </div>
        <select class="speed" id="speed" aria-label="speed">
          <option value="1">1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option>

        <div class="deck-btns">
          <button class="tbtn mark" data-act="mark-in" id="markIn" data-ti="t_in">I</button>
          <button class="tbtn mark" data-act="mark-out" id="markOut" data-ti="t_out">O</button>
        </div>
        <div class="scrub-wrap"><input class="scrub" id="scrub" type="range" min="0" max="0" value="0" aria-label="scrub"></div>

    <aside class="panel inspector" id="insp">
      <div class="panel-head"><span data-i="insp"></span></div>
      <div class="insp-scroll" id="inspBody"></div>
    </aside>
  </main>

  <section class="timeline" id="timeline">
    <div class="tl-bar">
      <span class="ttl" data-i="tl"></span>
      <span class="seg" role="group"><button data-axis="wall" aria-pressed="true" data-i="ax_wall"></button><button data-axis="step" aria-pressed="false" data-i="ax_step"></button></span>
      <button class="zoom-btn" data-zoom="out" aria-label="zoom out">−</button><button class="zoom-btn" data-zoom="in" aria-label="zoom in">+</button><button class="zoom-btn wide" data-zoom="fit" data-i="fit"></button>

      <div class="track-heads" id="trackHeads"></div>
      <div class="tl-canvas-wrap" id="tlWrap"><canvas id="tl"></canvas></div>
    </div>
  </section>
  <div class="scrim" id="scrim"></div>
</div>

<div class="render-q" id="renderQ"><div class="rq-t"><span id="rqTitle"></span><span id="rqPct" class="mono">0%</span></div><div class="rq-s" id="rqSub"></div><div class="rq-track"><i id="rqBar"></i></div></div>

  <div class="dlg-body"><p data-i="paste_p"></p><textarea id="pasteArea" spellcheck="false"></textarea></div>

<script id="core">
/* Agent Replay core: format detection, parsers, conform pass, sample reel, cut notes.
   No DOM access here, so the same code runs in node for testing. */
var AR = (function () {
  'use strict';
  var CAP = 200000;               // per-field cap at import (keeps memory bounded)
  var tick = function () { return new Promise(function (r) { setTimeout(r, 0); }); };

  function str(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    try { return JSON.stringify(v, null, 2); } catch (e) { return String(v); }
  }
  function clip(v) {
    var s = str(v);
    return s.length > CAP ? s.slice(0, CAP) + '\n… [' + (s.length - CAP) + ' more chars trimmed at import]' : s;
  }
  function toMs(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number' && isFinite(v)) {
      if (v >= 1e11) return v;           // epoch ms
      if (v >= 1e9) return v * 1000;     // epoch seconds
      return v * 1000;                   // seconds offset from start
    }
    if (typeof v === 'string') {
      var d = Date.parse(v);
      if (!isNaN(d)) return d;
      var f = parseFloat(v);
      if (!isNaN(f)) return toMs(f);
    }
    return null;
  }
  function firstLine(s, n) {
    s = String(s || '').replace(/^\s+/, '');

    toast(t('loaded', { n: r.steps.length, ms: AR.human(performance.now() - t0) }));
  } catch (err) {
    var code = err && /^(empty|unknown|nosteps)$/.test(err.message) ? err.message : 'unknown';
    if (!(err && /^(empty|unknown|nosteps)$/.test(err.message))) console.error(err);
    toast(t('err_' + code));
  } finally {
    setIngest(1); setTimeout(function () { $('#ingest').style.display = 'none'; $('#ingest i').style.width = '0'; }, 350);
  }
}
async function loadFile(f) {
  if (!f) return;
  setIngest(0.02);
  var text = await f.text();
  loadText(text, f.name.replace(/\.(jsonl|json|ndjson|txt|html)$/i, ''));
}
function setRun(r) {
  run = r; cur = 0; inMark = outMark = null; feedTo = -1;
  labels = r.steps.map(AR.label);
  trackOf = new Int8Array(r.steps.length); r.steps.forEach(function (s, i) { trackOf[i] = trackIndex(s); });
  fitView();
  $('#slate').hidden = true;
  renderSlate(); renderBinKinds(); rebuildBinIndex(); renderTools(); renderInspector(); syncMenus();
  renderFeed(false); syncAll();
}
function eject() {
  pause(); run = null; cur = 0; inMark = outMark = null; feedTo = -1; labels = [];
  $('#slate').hidden = false; renderFeed(false); renderSlate(); renderBinKinds(); rebuildBinIndex(); renderTools(); renderInspector(); syncMenus(); syncAll();
}
$('#fileIn').addEventListener('change', function (e) { loadFile(e.target.files[0]); e.target.value = ''; });
(function dnd() {
  var depth = 0, suite = $('#suite');
  document.addEventListener('dragenter', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { depth++; suite.classList.add('dropping'); } });
  document.addEventListener('dragleave', function () { depth = Math.max(0, depth - 1); if (!depth) suite.classList.remove('dropping'); });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); depth = 0; suite.classList.remove('dropping'); var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });
})();

/* ───────────── render / export ───────────── */
function slugName() {
  var s = String(run.meta.title || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 42);
  return s || 'agent-run';
}
function download(blob, name) {
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
}
var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
function rq(title, sub, pct) {
  var q = $('#renderQ'); q.classList.add('show');
  if (title != null) $('#rqTitle').textContent = title;
  if (sub != null) $('#rqSub').textContent = sub;
  $('#rqBar').style.width = pct + '%'; $('#rqPct').textContent = Math.round(pct) + '%';
}
var rqHide = null;
async function doRender() {
  if (!run) return;
  clearTimeout(rqHide);
  var a = lo(), b = hi();
  rq(t('rq_title'), t('rq_s0'), 6); await wait(160);
  var data = AR.portable(run, a, b);
  rq(null, t('rq_s1', { n: data.steps.length }), 34); await wait(180);
  var json = JSON.stringify(data).replace(/</g, '\\u003c').replace(/[\u2028\u2029]/g, function (c) { return c === '\u2028' ? '\\u2028' : '\\u2029'; });
  rq(null, t('rq_s2'), 63); await wait(180);
  var p = APP_SRC.indexOf(OPEN_TAG), q = APP_SRC.indexOf(CLOSE_TAG, p);
  var html = APP_SRC.slice(0, p + OPEN_TAG.length) + json + APP_SRC.slice(q);
  rq(null, t('rq_s3'), 86); await wait(140);
  var name = 'replay-' + slugName() + (a > 0 || b < N() - 1 ? '-' + (a + 1) + '-' + (b + 1) : '') + '.html';
  var blob = new Blob([html], { type: 'text/html' });
  download(blob, name);
  rq(t('rq_done'), name + ' · ' + AR.kfmt(blob.size) + 'B', 100);
  rqHide = setTimeout(function () { $('#renderQ').classList.remove('show'); }, 2600);
}
async function doNotes() {
  if (!run) return;
  clearTimeout(rqHide);
  rq(t('rq_notes'), t('rq_s0'), 30); await wait(160);
  var md = AR.toMarkdown(run, I18N[lang].md);
  var name = 'cut-notes-' + slugName() + '.md';
  rq(null, t('rq_s3'), 80); await wait(120);
  download(new Blob([md], { type: 'text/markdown' }), name);
  rq(t('rq_done'), name, 100);
  rqHide = setTimeout(function () { $('#renderQ').classList.remove('show'); }, 2200);
}

/* ───────────── menus, drawers, dialogs ───────────── */
function closeMenus() { $$('.menu.open').forEach(function (m) { m.classList.remove('open'); }); $$('.sub.open').forEach(function (m) { m.classList.remove('open'); }); }
$$('[data-menu]').forEach(function (m) {
  var title = $('.menu-title', m);
  title.addEventListener('click', function (e) { e.stopPropagation(); var was = m.classList.contains('open'); closeMenus(); if (!was) m.classList.add('open'); });
  title.addEventListener('mouseenter', function () { if ($('.menu.open') && !m.classList.contains('open')) { closeMenus(); m.classList.add('open'); } });
});
$$('[data-subopen]').forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); b.parentElement.classList.toggle('open'); }); });
document.addEventListener('click', function (e) { if (!e.target.closest('.menu')) closeMenus(); });
function act(name) {
  closeMenus();
  if (name === 'open') $('#fileIn').click();
  else if (name === 'paste') { $('#dlgPaste').showModal(); setTimeout(function () { $('#pasteArea').focus(); }, 30); }
  else if (name === 'sample') loadText(AR.buildSample(), null);
  else if (name === 'eject') eject();
  else if (name === 'render') doRender();
  else if (name === 'notes') doNotes();
  else if (name === 'axis-wall') setAxis('wall');
  else if (name === 'axis-step') setAxis('step');
  else if (name === 'fit') { if (run) { fitView(); drawTL(); } }
  else if (name === 'formats') $('#dlgFormats').showModal();
  else if (name === 'keys') $('#dlgKeys').showModal();
  else if (name === 'toggle') toggle();
  else if (name === 'home') { pause(); go(lo(), false); }
  else if (name === 'end') { pause(); go(hi(), false); }
  else if (name === 'back') stepBy(-1);
  else if (name === 'fwd') stepBy(1);
  else if (name === 'mark-in') markIn();
  else if (name === 'mark-out') markOut();
}
document.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act); });
$$('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { lang = b.dataset.lang; store.set('ar.lang', lang); closeMenus(); applyI18n(); }); });
$$('[data-theme-pick]').forEach(function (b) { b.addEventListener('click', function () { store.set('ar.theme', b.dataset.themePick); closeMenus(); applyTheme(); }); });
$$('[data-axis]').forEach(function (b) { b.addEventListener('click', function () { setAxis(b.dataset.axis); }); });
$$('[data-zoom]').forEach(function (b) {
  b.addEventListener('click', function () {
    if (!run) return;
    var z = b.dataset.zoom;
    if (z === 'fit') fitView(); else zoomAt(point(cur), z === 'in' ? 1 / 1.6 : 1.6);
    drawTL();
  });
});
$$('dialog [data-close]').forEach(function (b) { b.addEventListener('click', function () { b.closest('dialog').close(); }); });
$('#pasteGo').addEventListener('click', function () { var v = $('#pasteArea').value; $('#dlgPaste').close(); if (v.trim()) { loadText(v, null); $('#pasteArea').value = ''; } });
function closeDrawers() { $('#suite').classList.remove('show-bin', 'show-insp'); }
$$('[data-drawer]').forEach(function (b) {
  b.addEventListener('click', function () {
    var cls = b.dataset.drawer === 'bin' ? 'show-bin' : 'show-insp', s = $('#suite'), on = s.classList.contains(cls);
    closeDrawers(); if (!on) s.classList.add(cls);
    if (!on) requestAnimationFrame(function () { renderBinRows(); drawLevels(); });
  });
});
$('#scrim').addEventListener('click', closeDrawers);

var toastT = null;
function toast(msg) { var el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2600); }

/* ───────────── keyboard (editor-style) ───────────── */
document.addEventListener('keydown', function (e) {
  var tg = e.target, typing = tg && (tg.tagName === 'INPUT' && tg.type !== 'range' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable);
  if ($('dialog[open]')) return;
  if (e.key === 'Escape') { closeMenus(); closeDrawers(); return; }
  if ((e.metaKey || e.ctrlKey) && (e.key === 'o' || e.key === 'O')) { e.preventDefault(); act('open'); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;
  if (k === '?') { act('keys'); return; }
  if (k === 'R' && e.shiftKey) { e.preventDefault(); doRender(); return; }
  if (!run) return;
  var handled = true;
  if (k === ' ' || k === 'Spacebar') toggle();
  else if (k === 'k' || k === 'K') pause();
  else if (k === 'l' || k === 'L') shuttle(1);
  else if (k === 'j' || k === 'J') shuttle(-1);
  else if (k === 'ArrowRight') stepBy(e.shiftKey ? 10 : 1);
  else if (k === 'ArrowLeft') stepBy(e.shiftKey ? -10 : -1);
  else if (k === 'Home') { pause(); go(lo(), false); }
  else if (k === 'End') { pause(); go(hi(), false); }
  else if (k === 'i' || k === 'I') markIn();
  else if (k === 'o' || k === 'O') markOut();
  else if (k === 'x' || k === 'X') clearMarks();
  else if (k === 'f' || k === 'F') { fitView(); drawTL(); }
  else handled = false;
  if (handled) e.preventDefault();
});

/* ───────────── redraw hooks ───────────── */
function redrawAll() { drawTL(); drawLevels(); }
document.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b && b.closest('.transport, .tl-bar, .slate-actions, .menubar')) b.blur(); });
if (window.ResizeObserver) {
  new ResizeObserver(function () { requestAnimationFrame(function () { redrawAll(); renderBinRows(); }); }).observe(document.body);
} else window.addEventListener('resize', redrawAll);
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { requestAnimationFrame(redrawAll); }); } catch (e) {}

/* ───────────── boot ───────────── */
applyTheme(); applyI18n(); renderInspector(); updateTransport(); drawTL();
var emb = document.getElementById('embedded-run'), embText = emb ? emb.textContent.trim() : '';
if (embText) loadText(embText, null);
})();
</script>
</body>
