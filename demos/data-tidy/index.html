<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidy Data Ritual</title>
<meta name="description" content="Tidy a messy spreadsheet so AI agents can actually use it. Runs entirely in your browser.">
<style>
:root{
  --linen:#f4efe6; --linen-deep:#ece5d8; --paper:#fbf8f2; --ink:#2d2a26; --ink-soft:#544d46; --ink-faint:#6e6559;
  --thread:#ddd4c5; --clay:#a8603f; --clay-soft:#efdccf; --clay-ink:#8f5236; --sage:#6f8a6c; --sage-ink:#4c6849; --sage-soft:#dfe7da;
  --sand:#c9a46a; --sand-ink:#7e5f27; --sand-soft:#f3e7cf; --rose:#9b443d; --on-clay:#ffffff; --rose-soft:#f3dcd7; --fold:#f6e9c9; --shadow:0 1px 2px rgba(60,44,30,.05),0 8px 28px -12px rgba(60,44,30,.18);
  --sans:"Avenir Next","Avenir","Hiragino Sans","PingFang SC","Noto Sans CJK SC","Segoe UI",system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype","Palatino","Songti SC","Noto Serif CJK SC",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --linen:#1f1b18; --linen-deep:#28231f; --paper:#2a2521; --ink:#ece4d8; --ink-soft:#c4b8a9; --ink-faint:#b0a495;
  --thread:#3b342e; --clay:#d39a7c; --clay-soft:#43302a; --clay-ink:#e8b89e; --sage:#9db597; --sage-ink:#aac2a4; --sage-soft:#2c362b;
  --sand:#d8b57a; --sand-ink:#e2c38e; --sand-soft:#3b3224; --rose:#e39389; --on-clay:#1f1b18; --rose-soft:#43292a; --fold:#3f3421; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --linen:#1f1b18; --linen-deep:#28231f; --paper:#2a2521; --ink:#ece4d8; --ink-soft:#c4b8a9; --ink-faint:#b0a495;
  --thread:#3b342e; --clay:#d39a7c; --clay-soft:#43302a; --clay-ink:#e8b89e; --sage:#9db597; --sage-ink:#aac2a4; --sage-soft:#2c362b;
  --sand:#d8b57a; --sand-ink:#e2c38e; --sand-soft:#3b3224; --rose:#e39389; --on-clay:#1f1b18; --rose-soft:#43292a; --fold:#3f3421; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--linen);color:var(--ink);font:400 16px/1.65 var(--sans);letter-spacing:.005em;
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,100,70,.018) 3px 4px),repeating-linear-gradient(90deg,transparent 0 3px,rgba(120,100,70,.014) 3px 4px)}
b,strong{font-weight:600}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--clay-ink)}
.serif{font-family:var(--serif);font-weight:400}
.hush{color:var(--ink-faint)}
.soft{color:var(--ink-soft)}
.mono{font-family:var(--mono);font-size:.86em}

/* ---------- top band ---------- */
.mantle{max-width:1080px;margin:0 auto;padding:22px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.seal{display:flex;align-items:center;gap:12px;min-width:0}
.seal svg{flex:none}
.seal-name{font-family:var(--serif);font-size:20px;line-height:1.1;font-weight:400}
.seal-line{font-size:12.5px;color:var(--ink-faint);line-height:1.3}
.tongue{display:flex;gap:2px;font-size:13px;color:var(--ink-faint);flex:none}
.tongue button{background:none;border:0;padding:4px 6px;cursor:pointer;color:var(--ink-faint);border-bottom:1px solid transparent}
.tongue button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--clay)}
.tongue span{padding:4px 0}

.promise{max-width:1080px;margin:14px auto 0;padding:0 16px}
.promise-inner{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--thread);border-radius:999px;background:var(--paper);font-size:14px;width:fit-content;max-width:100%}
.promise-inner svg{flex:none;color:var(--sage-ink)}
.promise-inner b{font-weight:500}

/* ---------- ritual path ---------- */
.path{max-width:1080px;margin:28px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.path::before{content:"";position:absolute;left:calc(12.5% + 0px);right:calc(12.5% + 0px);top:15px;height:1px;background:var(--thread)}
.waypoint{position:relative;background:none;border:0;padding:0 4px;cursor:pointer;text-align:center;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:6px}
.waypoint[disabled]{cursor:default}
.waypoint .pebble{width:31px;height:31px;border-radius:50%;background:var(--linen);border:1px solid var(--thread);display:grid;place-items:center;font-family:var(--serif);font-size:14px;transition:all .4s ease;position:relative;z-index:1}
.waypoint.here .pebble{background:var(--clay);border-color:var(--clay);color:var(--on-clay)}
.waypoint.walked .pebble{background:var(--sage-soft);border-color:var(--sage);color:var(--sage-ink)}
.waypoint .wp-name{font-size:13.5px;line-height:1.25}
.waypoint.here .wp-name{color:var(--ink);font-weight:500}

main{max-width:1080px;margin:0 auto;padding:8px 16px 80px}
.chapter{display:none;animation:rise .6s ease both}
.chapter.open{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.verse{margin:44px 0 26px;max-width:720px}
.verse .numeral{font-family:var(--serif);color:var(--clay-ink);font-size:15px;letter-spacing:.12em}
.verse h1,.verse h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4.6vw,42px);line-height:1.15;margin:6px 0 12px;letter-spacing:-.01em}
.verse p{margin:0;color:var(--ink-soft);font-size:17px}

.linen-card{background:var(--paper);border:1px solid var(--thread);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.gentle-btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--linen);cursor:pointer;font-weight:500;font-size:15px;transition:transform .2s,opacity .2s}
.gentle-btn:hover{transform:translateY(-1px)}
.gentle-btn.quiet{background:transparent;color:var(--ink);border-color:var(--thread)}
.gentle-btn.quiet:hover{border-color:var(--ink-soft)}
.gentle-btn.clay{background:var(--clay);border-color:var(--clay);color:var(--on-clay)}
.gentle-btn[disabled]{opacity:.45;cursor:default;transform:none}
.row-gap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- gather ---------- */
.gather-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.basket{border:1.5px dashed var(--thread);border-radius:22px;padding:42px 22px;text-align:center;background:var(--paper);transition:all .3s;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:260px;justify-content:center}
.basket.warm{border-color:var(--clay);background:var(--clay-soft)}
.basket h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:4px 0 0}
.basket p{margin:0;color:var(--ink-faint);font-size:13.5px}
.pasteboard{display:flex;flex-direction:column;gap:10px}
.pasteboard textarea{width:100%;min-height:170px;resize:vertical;border:1px solid var(--thread);border-radius:14px;background:var(--paper);padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.pasteboard textarea:focus,.label-field:focus{outline:2px solid var(--clay-soft);border-color:var(--clay)}
.label-small{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.offering{margin-top:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 20px;border-radius:18px;background:var(--linen-deep)}
.offering p{margin:0;flex:1 1 260px;font-size:14.5px;color:var(--ink-soft)}

/* ---------- score: filling bowl ---------- */
.bowl-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.bowl{position:relative;width:150px;height:150px;flex:none}
.bowl svg{display:block}
.bowl .bowl-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif)}
.bowl .bowl-num b{font-size:42px;font-weight:400;line-height:1}
.bowl .bowl-num small{font-family:var(--sans);font-size:11px;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.bowl.small{width:96px;height:96px}
.bowl.small .bowl-num b{font-size:28px}
.water{transition:transform 1.6s cubic-bezier(.3,.7,.2,1)}
.wave{animation:drift 7s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.threads{display:flex;flex-direction:column;gap:12px;flex:1 1 280px;min-width:0}
.thread-row{display:grid;grid-template-columns:minmax(120px,170px) 1fr 34px;gap:12px;align-items:center;font-size:14px}
.thread-row .t-name{color:var(--ink-soft);line-height:1.25}
.thread-bar{height:6px;border-radius:6px;background:var(--linen-deep);overflow:hidden}
.thread-bar i{display:block;height:100%;border-radius:6px;background:var(--sage);transition:width 1.2s ease}
.thread-bar i.mid{background:var(--sand)}
.thread-bar i.low{background:var(--clay)}
.thread-row .t-val{text-align:right;font-family:var(--serif);font-size:16px}
.whisper{font-family:var(--serif);font-size:20px;margin:0 0 4px;font-weight:400}

/* ---------- look: column cards ---------- */
.overview{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.drawer-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:22px 0 6px;scrollbar-width:thin}
.tab-cloth{flex:none;border:1px solid var(--thread);background:var(--paper);border-radius:10px;padding:6px 10px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;max-width:180px;color:var(--ink-soft)}
.tab-cloth span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-cloth.on{border-color:var(--ink);color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sage);flex:none}
.dot.mid{background:var(--sand)} .dot.low{background:var(--clay)} .dot.none{background:var(--ink-faint)}
.card-stage{perspective:1400px;position:relative}
.column-leaf{background:var(--paper);border:1px solid var(--thread);border-radius:22px;padding:26px;box-shadow:var(--shadow);transform-origin:left center;min-height:380px}
.column-leaf.turn-next{animation:turnNext .55s ease both}
.column-leaf.turn-prev{animation:turnPrev .55s ease both}
@keyframes turnNext{from{opacity:0;transform:rotateY(-14deg) translateX(30px)}to{opacity:1;transform:none}}
@keyframes turnPrev{from{opacity:0;transform:rotateY(14deg) translateX(-30px)}to{opacity:1;transform:none}}
.leaf-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.leaf-count{font-size:12.5px;color:var(--ink-faint);letter-spacing:.08em}
.leaf-title{font-family:var(--mono);font-size:22px;margin:4px 0 2px;word-break:break-all}
.leaf-title .ghost-space{background:var(--rose-soft);color:var(--rose);border-radius:3px;padding:0 2px}
.leaf-q{font-family:var(--serif);font-size:19px;margin:18px 0 8px;font-style:italic;color:var(--ink-soft)}
.leaf-answer{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;padding:6px 14px;border-radius:999px;background:var(--sage-soft);color:var(--sage-ink)}
.leaf-answer.mid{background:var(--sand-soft);color:var(--sand-ink)}
.leaf-answer.low{background:var(--clay-soft);color:var(--clay-ink)}
.leaf-body{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:22px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.fact{border-top:1px solid var(--thread);padding-top:8px}
.fact small{display:block;font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase}
.fact span{font-family:var(--serif);font-size:20px}
.kind-chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--thread);color:var(--ink-soft)}
.toplist{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.toplist .tv{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:center}
.toplist .tv-label{position:relative;padding:3px 8px;border-radius:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.toplist .tv-label i{position:absolute;left:0;top:0;bottom:0;background:var(--linen-deep);z-index:0;border-radius:6px}
.toplist .tv-label span{position:relative;z-index:1}
.toplist .tv-n{text-align:right;color:var(--ink-faint);font-size:12.5px}
.hist{margin-top:14px}
.hist rect{fill:var(--sage);opacity:.75}
.hist-axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-faint)}
.notice-list{display:flex;flex-direction:column;gap:12px}
.notice{border-left:2px solid var(--sage);padding:2px 0 2px 14px}
.notice.high{border-color:var(--clay)} .notice.medium{border-color:var(--sand)} .notice.low{border-color:var(--sage)}
.notice-h{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.notice-h b{font-weight:500}
.weight{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:999px}
.weight.high{background:var(--clay-soft);color:var(--clay-ink)} .weight.medium{background:var(--sand-soft);color:var(--sand-ink)} .weight.low{background:var(--sage-soft);color:var(--sage-ink)}
.notice-n{font-size:12.5px;color:var(--ink-faint)}
.samples{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.samples code{font-family:var(--mono);font-size:12px;background:var(--linen-deep);padding:1px 7px;border-radius:5px;white-space:pre;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.why{margin:0;font-size:14px;color:var(--ink-soft)}
.why em{font-style:normal;color:var(--ink-faint)}
.leaf-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.calm-empty{color:var(--ink-faint);font-style:italic;font-family:var(--serif)}
.rename-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;font-size:14px}
.label-field{border:1px solid var(--thread);border-radius:10px;background:var(--linen);padding:7px 10px;font-family:var(--mono);font-size:13px;min-width:0}
details.whole-list{margin-top:26px}
details.whole-list summary{cursor:pointer;font-family:var(--serif);font-size:19px;list-style:none;display:flex;align-items:center;gap:8px}
details.whole-list summary::before{content:"+";color:var(--clay-ink);font-family:var(--sans);width:16px}
details.whole-list[open] summary::before{content:"–"}
.whole-list .notice-list{margin-top:16px}

/* ---------- tables ---------- */
.tray{overflow:auto;max-height:520px;border:1px solid var(--thread);border-radius:14px;background:var(--paper);-webkit-overflow-scrolling:touch}
.tray table{border-collapse:separate;border-spacing:0;font-size:12.8px;min-width:100%}
.tray th,.tray td{padding:7px 12px;border-bottom:1px solid var(--thread);white-space:nowrap;text-align:left;vertical-align:top;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.tray th{position:sticky;top:0;background:var(--linen-deep);font-weight:500;z-index:1;font-family:var(--mono);font-size:12px}
.tray th small{display:block;font-family:var(--sans);color:var(--ink-faint);font-weight:400;text-decoration:line-through}
.tray td.rn,.tray th.rn{color:var(--ink-faint);text-align:right;font-family:var(--mono);font-size:11px;position:sticky;left:0;background:var(--paper)}
.tray th.rn{background:var(--linen-deep);z-index:2}
.c-null{color:var(--rose);font-style:italic}
.c-ws{background:var(--rose-soft)}
.c-junk{background:var(--sand-soft)}
.c-flag{color:var(--clay-ink);font-size:12px}
td.folded{background:var(--fold);animation:foldIn .7s ease both;animation-delay:var(--d,0s)}
td.folded del{display:block;font-size:11px;color:var(--ink-faint);text-decoration-color:var(--clay)}
@keyframes foldIn{0%{transform:rotateX(85deg);opacity:.2;background:var(--rose-soft)}60%{transform:rotateX(-8deg);opacity:1}100%{transform:none}}
tr.let-go td{opacity:.45;text-decoration:line-through}

/* ---------- let go ---------- */
.letgo-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.gesture{display:grid;grid-template-columns:22px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--thread);align-items:start}
.gesture:last-child{border-bottom:0}
.gesture input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--clay)}
.gesture label{cursor:pointer}
.gesture .g-name{font-weight:400}
.gesture .g-desc{font-size:13.5px;color:var(--ink-soft);display:block;margin-top:2px}
.gesture .g-n{font-family:var(--serif);color:var(--clay-ink);font-size:15px;white-space:nowrap}
.gesture.idle .g-n{color:var(--ink-faint)}
.before-after{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.arrow-soft{font-family:var(--serif);font-size:28px;color:var(--ink-faint)}
.delta{font-size:13px;color:var(--sage-ink)}
.delta.neg{color:var(--rose)}
.compare-rows{margin-top:16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.compare-rows div{display:grid;grid-template-columns:1fr 40px 18px 40px 44px;gap:6px;align-items:center}
.compare-rows .num{font-family:var(--serif);text-align:right}
.pending-note{font-size:13px;color:var(--clay-ink);margin:0}
.cluster{border:1px solid var(--thread);border-radius:14px;padding:14px;margin-top:12px;background:var(--linen)}
.cluster-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.pile{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pile label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--thread);border-radius:999px;padding:3px 10px 3px 6px;font-family:var(--mono);font-size:12px;cursor:pointer;background:var(--paper)}
.pile label.off{color:var(--ink-faint);border-style:dashed;text-decoration:line-through}
.pile input{accent-color:var(--clay);margin:0}
.pile em{font-style:normal;color:var(--ink-faint);font-family:var(--sans)}
.rename-table{width:100%;border-collapse:collapse;font-size:13.5px}
.rename-table td{padding:7px 6px;border-bottom:1px solid var(--thread);vertical-align:middle}
.rename-table td:first-child{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);word-break:break-all}
.rename-table .label-field{width:100%}
.section-title{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 4px}
.section-sub{margin:0 0 10px;font-size:14px;color:var(--ink-soft)}
.toggle-line{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);cursor:pointer}
.toggle-line input{accent-color:var(--clay)}

/* ---------- put away: drawers ---------- */
.dresser{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.drawer{position:relative;background:var(--paper);border:1px solid var(--thread);border-radius:16px;padding:20px 20px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;overflow:hidden}
.drawer::before{content:"";position:absolute;left:50%;top:12px;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:var(--thread)}
.drawer .tag-label{margin-top:12px;align-self:flex-start;font-family:var(--mono);font-size:12px;background:var(--linen-deep);padding:3px 10px;border-radius:4px;border:1px dashed var(--ink-faint)}
.drawer h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:4px 0 0}
.drawer p{margin:0;font-size:13.5px;color:var(--ink-soft);flex:1}
.drawer button{align-self:flex-start;margin-top:6px}
.drawer.opened{animation:slideOut .5s ease}
@keyframes slideOut{0%{transform:none}40%{transform:translateY(6px)}100%{transform:none}}
.label-book{margin-top:22px}
.ledger{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
.ledger th{text-align:left;font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:8px;border-bottom:1px solid var(--thread);position:static;background:none;font-family:var(--sans)}
.ledger td{padding:8px;border-bottom:1px solid var(--thread);vertical-align:top;white-space:normal;max-width:none}
.ledger td:first-child{font-family:var(--mono);font-size:12.5px;word-break:break-all;min-width:120px}
.ledger textarea{width:100%;min-height:54px;resize:vertical;border:1px solid var(--thread);border-radius:10px;background:var(--linen);padding:7px 9px;font-size:13px;line-height:1.45}
.ledger input,.ledger select{width:100%;border:1px solid var(--thread);border-radius:10px;background:var(--linen);padding:6px 8px;font-size:13px}
.ledger-wrap{overflow-x:auto;border:1px solid var(--thread);border-radius:14px;background:var(--paper);padding:4px 8px}
.md-peek{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--linen-deep);border-radius:14px;padding:14px;max-height:300px;overflow:auto;margin:0}

/* ---------- veil ---------- */
.veil{position:fixed;inset:0;background:color-mix(in srgb,var(--linen) 82%,transparent);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.veil.on{display:flex}
.veil-card{background:var(--paper);border:1px solid var(--thread);border-radius:20px;padding:26px 28px;min-width:min(340px,100%);box-shadow:var(--shadow);text-align:center}
.veil-card p{margin:10px 0 14px;font-family:var(--serif);font-size:18px}
.breath{width:46px;height:46px;border-radius:50%;background:var(--clay-soft);margin:0 auto;animation:breathe 2.4s ease-in-out infinite;border:1px solid var(--clay)}
@keyframes breathe{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.08);opacity:1}}
.veil-bar{height:3px;background:var(--linen-deep);border-radius:3px;overflow:hidden}
.veil-bar i{display:block;height:100%;width:0;background:var(--clay);transition:width .2s}
.note-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--linen);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:all .4s;z-index:60;max-width:calc(100% - 32px)}
.note-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.colophon{max-width:1080px;margin:0 auto;padding:0 16px 40px;font-size:12.5px;color:var(--ink-faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack-gap>*+*{margin-top:18px}

@media (max-width:820px){
  .gather-grid,.letgo-grid,.leaf-body,.overview{grid-template-columns:1fr}
  .overview{justify-items:start}
}
@media (max-width:560px){
  .mantle{padding-top:16px}
  .seal-line{display:none}
  .path .wp-name{font-size:11.5px}
  .linen-card,.column-leaf{padding:18px;border-radius:16px}
  .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .thread-row{grid-template-columns:96px 1fr 30px;gap:8px;font-size:13px}
  .verse{margin-top:30px}
  .basket{min-height:200px;padding:28px 16px}
  .bowl-wrap{gap:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  if (p.amb) { if (dayFirst) { d = p.a; m = p.b; } else { m = p.a; d = p.b; } }
  if (!validYMD(y, m, d)) return null;
  let s = y + "-" + pad2(m) + "-" + pad2(d);
  if (p.time) s += "T" + pad2(p.time.h) + ":" + pad2(p.time.mi) + ":" + pad2(p.time.s) + (p.time.tz ? (p.time.tz === "Z" ? "Z" : p.time.tz.replace(/^([+-]\d{2})(\d{2})$/, "$1:$2")) : "");

}

function classify(v) {
  if (RE_INT.test(v)) return "int";
  if (RE_NUM.test(v)) return "num";
  if (RE_BOOL.test(v)) return "bool";
  if (v.indexOf("@") >= 0 || /\(at\)|\[at\]/i.test(v)) return RE_EMAIL.test(v) ? "email" : "bademail";
  if (parseDate(v)) return "date";

/* ---------- headers ---------- */
const VAGUE_RE = /^(col|column|field|var|variable|attr|attribute|unnamed|untitled|f|c|v|x|y|z|q)[\s_.:#-]*\d*$|^(val|value|values|data|info|misc|other|others|tmp|temp|stuff|thing|item|num|no|number|amt|desc|text|txt|n|etc|new|test|\d+)$/i;

    .replace(/([a-z0-9])([A-Z])/g, "$1_$2").toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, "_").replace(/^_+|_+$/g, "").replace(/_+/g, "_");
  return out;
}
function isIdHeader(h) { const s = String(h).trim(); return /(^|[^A-Za-z])(id|uuid|guid)$/i.test(s) || /^id([^A-Za-z]|$)/i.test(s) || /[a-z]ID$/.test(s) || /编号|工号/.test(s); }

/* ---------- category clustering ---------- */
function fold(s) { return String(s).normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ""); }

  let prev = new Array(b.length + 1); for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < rowMin) rowMin = cur[j];

}
function isSubseq(s, t) { let i = 0; for (let j = 0; j < t.length && i < s.length; j++) if (s[i] === t[j]) i++; return i === s.length; }
function looksAbbrev(v) { return /^[A-Z]{2,4}\.?$/.test(v) || /^[A-Za-z]{2,8}\.$/.test(v) || /^([A-Za-z]\.){2,4}$/.test(v); }

    const k = fold(v); if (!k) continue;
    let g = groups.get(k); if (!g) { g = { key: k, variants: [], total: 0, abbr: false }; groups.set(k, g); }
    g.variants.push({ v, c }); g.total += c;

  const gs = [...groups.values()];
  for (const g of gs) g.abbr = g.variants.every(x => looksAbbrev(x.v));
  const parent = gs.map((_, i) => i);
  const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[b] = a; };
  if (gs.length <= 400) {
    gs.forEach((g, i) => {
      if (!g.abbr || g.key.length < 2) return;
      const targets = [];
      gs.forEach((h, j) => { if (j !== i && !h.abbr && h.key.length > g.key.length && h.key[0] === g.key[0] && isSubseq(g.key, h.key)) targets.push(j); });
      if (targets.length === 1) union(targets[0], i);
    });
    for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) {
      const a = gs[i].key, b = gs[j].key;
      if (a.length < 4 || b.length < 4 || a[0] !== b[0]) continue;
      if (/\d/.test(a) || /\d/.test(b)) continue;
      const max = Math.min(a.length, b.length) >= 8 ? 2 : 1;
      if (lev(a, b, max) <= max) union(i, j);
    }
  }
  const byRoot = new Map();
  gs.forEach((g, i) => { const r = find(i); if (!byRoot.has(r)) byRoot.set(r, []); byRoot.get(r).push(g); });
  const clusters = [];
  for (const members of byRoot.values()) {
    const variants = []; members.forEach(g => g.variants.forEach(x => variants.push({ v: x.v, c: x.c, key: g.key })));
    if (variants.length < 2) continue;
    const full = members.filter(g => !g.abbr);
    const pool = (full.length ? full : members);
    let bestG = pool[0];
    for (const g of pool) if (g.key.length > bestG.key.length || (g.key.length === bestG.key.length && g.total > bestG.total)) bestG = g;
    let canon = bestG.variants[0];
    const nice = x => (/^\p{Lu}/u.test(x.v) && x.v !== x.v.toUpperCase() ? 1 : 0);
    for (const x of bestG.variants) if (x.c > canon.c || (x.c === canon.c && nice(x) > nice(canon))) canon = x;
    variants.sort((a, b) => b.c - a.c);

}

/* ---------- profiling ---------- */
function profileColumn(name, idx, rows, isMeta) {
  const n = rows.length;
  const p = { name, idx, n, role: isMeta ? "meta" : "data", nulls: 0, nullTok: 0, nullForms: new Map(), ws: 0, wsEx: [], junk: 0, junkEx: [], emoji: 0, emojiEx: [],
    distinct: 0, top: [], type: "text", invalid: 0, invalidEx: [], invalidSet: new Set(), fmtCells: 0, fmtEx: [], unitCells: 0, units: new Map(), currencies: new Map(),
    domUnit: null, dim: null, dateFormats: new Map(), nonIso: 0, nonIsoEx: [], dayFirst: false, min: null, max: null, hist: null, allInt: true, clusters: [], catOff: 0, emailUpper: 0, header: {} };
  const counts = new Map();
  for (let r = 0; r < n; r++) {
    const v = rows[r][idx];
    if (v === "" || v == null) { p.nulls++; continue; }
    const tr = v.trim();
    if (NULL_SET.has(tr.toLowerCase())) { p.nulls++; p.nullTok++; p.nullForms.set(v, (p.nullForms.get(v) || 0) + 1); continue; }
    if (v !== tr || /\s{2,}|[ \t\r\n　]/.test(v)) { p.ws++; if (p.wsEx.length < 4 && p.wsEx.indexOf(v) < 0) p.wsEx.push(v); }
    if (hasJunk(v)) { p.junk++; if (p.junkEx.length < 4 && p.junkEx.indexOf(v) < 0) p.junkEx.push(v); }
    if (RE_EMOJI.test(v)) { p.emoji++; if (p.emojiEx.length < 4 && p.emojiEx.indexOf(v) < 0) p.emojiEx.push(v); }
    const key = collapse(tr);
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  const nonNull = n - p.nulls;
  p.nonNull = nonNull; p.distinct = counts.size;
  p.nullPct = n ? p.nulls / n : 0;
  const cls = { int: 0, num: 0, fmtnum: 0, unitnum: 0, bool: 0, email: 0, bademail: 0, date: 0, text: 0 };
  const clsOf = new Map();
  for (const [k, c] of counts) { const cl = classify(k); clsOf.set(k, cl); cls[cl] += c; }
  p.cls = cls;
  const numeric = cls.int + cls.num + cls.fmtnum + cls.unitnum;
  if (isMeta) p.type = "text";
  else if (nonNull === 0) p.type = "empty";
  else if (cls.email + cls.bademail >= 0.5 * nonNull || (/e-?mail|邮箱/i.test(name) && cls.email >= 0.3 * nonNull)) p.type = "email";
  else if (cls.date >= 0.6 * nonNull) p.type = "date";
  else if (numeric >= 0.6 * nonNull) p.type = cls.unitnum > 0 ? "measure" : "number";
  else if (cls.bool >= 0.9 * nonNull && counts.size <= 6) p.type = "boolean";
  else if (counts.size <= 60 && counts.size <= Math.max(2, 0.5 * nonNull) && nonNull >= 4 && !/note|comment|remark|memo|desc|message|备注|说明/i.test(name)) {
    let words = 0; for (const [k, c] of counts) words += (k.split(" ").length) * c;
    if (words / nonNull <= 3.5) p.type = "category";
  }

  const addInvalid = (k, c) => { p.invalid += c; p.invalidSet.add(k); if (p.invalidEx.length < 4) p.invalidEx.push(k); };
  if (p.type === "email") {
    for (const [k, c] of counts) { const cl = clsOf.get(k); if (cl !== "email") addInvalid(k, c); else if (k !== k.toLowerCase()) p.emailUpper += c; }
  } else if (p.type === "date") {
    const parsed = new Map(); let ambDay = 0, ambMon = 0;
    for (const [k, c] of counts) {
      if (clsOf.get(k) !== "date") { addInvalid(k, c); continue; }
      const pd = parseDate(k); parsed.set(k, pd);
      if (pd.amb) { if (pd.a > 12 && pd.b <= 12) ambDay += c; else if (pd.b > 12 && pd.a <= 12) ambMon += c; }
    }
    p.dayFirst = ambDay > ambMon;
    let withTime = 0;
    for (const [k, pd] of parsed) {
      const c = counts.get(k);
      const iso = resolveDate(pd, p.dayFirst);
      if (!iso) { addInvalid(k, c); continue; }
      let lab = pd.fmt;
      if (pd.amb) { const yl = pd.yl === 2 ? "YY" : "YYYY"; lab = (p.dayFirst ? "DD" + pd.sep + "MM" : "MM" + pd.sep + "DD") + pd.sep + yl; }
      if (pd.time) { withTime += c; lab += " hh:mm"; }
      p.dateFormats.set(lab, (p.dateFormats.get(lab) || 0) + c);
      if (iso !== k) { p.nonIso += c; if (p.nonIsoEx.length < 4) p.nonIsoEx.push(k); }
      const d = iso.slice(0, 10);
      if (p.min === null || d < p.min) p.min = d;
      if (p.max === null || d > p.max) p.max = d;
    }
    if (withTime > 0.5 * (nonNull - p.invalid)) p.type = "datetime";
  } else if (p.type === "number" || p.type === "measure") {
    const parsed = [];
    for (const [k, c] of counts) {
      const cl = clsOf.get(k);
      if (!(cl === "int" || cl === "num" || cl === "fmtnum" || cl === "unitnum")) { addInvalid(k, c); continue; }
      const ln = cl === "int" || cl === "num" ? { value: parseFloat(k), plain: true } : parseNumberish(k);
      if (!ln) { addInvalid(k, c); continue; }
      if (!ln.plain) { p.fmtCells += c; if (p.fmtEx.length < 5) p.fmtEx.push(k); }
      if (ln.unit) { p.unitCells += c; p.units.set(ln.unit, (p.units.get(ln.unit) || 0) + c); }
      if (ln.cur) p.currencies.set(ln.cur, (p.currencies.get(ln.cur) || 0) + c);
      parsed.push([k, ln, c]);
    }
    if (p.type === "measure") {
      let best = null, bc = -1;
      for (const [u, c] of p.units) if (c > bc) { best = u; bc = c; }
      p.domUnit = best; p.dim = UNIT_CANON[best][0];
    }
    const vals = [];
    for (const [k, ln, c] of parsed) {
      let v = ln.value;
      if (p.type === "measure" && ln.unit) {
        const u = UNIT_CANON[ln.unit];
        if (u[0] !== p.dim) { addInvalid(k, c); continue; }
        v = v * u[1] / UNIT_CANON[p.domUnit][1];
      }
      if (!Number.isInteger(v)) p.allInt = false;
      vals.push([v, c]);
    }
    if (p.type === "number" && p.allInt) p.type = "integer";
    if (vals.length) {
      let mn = Infinity, mx = -Infinity;
      for (const [v] of vals) { if (v < mn) mn = v; if (v > mx) mx = v; }
      p.min = mn; p.max = mx;
      const B = 18, bins = new Array(B).fill(0), span = mx - mn || 1;
      for (const [v, c] of vals) bins[Math.min(B - 1, Math.floor((v - mn) / span * B))] += c;
      p.hist = bins;
    }
  } else if (p.type === "category") {
    p.clusters = clusterValues(counts).filter(c => c.variants.length > 1);
    for (const cl of p.clusters) for (const x of cl.variants) if (x.v !== cl.canonical) p.catOff += x.c;
  }
  if (!isMeta && (p.type === "integer" || p.type === "text" || p.type === "category") && isIdHeader(name) && nonNull && counts.size / nonNull >= 0.8) p.role = "id";
  if (!isMeta && p.type === "text" && /^(id|key|uuid)$/i.test(name.trim()) && counts.size / Math.max(1, nonNull) >= 0.8) p.role = "id";
  p.top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
  const h = String(name);
  p.header = { blank: h.trim() === "", vague: VAGUE_RE.test(h.trim()), ws: h !== h.trim() || /\s{2,}/.test(h), clean: h === toSnake(h) && h !== "", dup: false };
  return p;
}

async function audit(table, onProgress) {
  const H = table.headers, R = table.rows, n = R.length;
  const profiles = [];
  for (let c = 0; c < H.length; c++) {
    profiles.push(profileColumn(H[c], c, R, H[c] === "_review_flag"));
    if (onProgress) onProgress((c + 1) / (H.length + 1));
    await tick();
  }
  const seenH = new Map();
  for (const p of profiles) { const k = p.name.trim().toLowerCase(); seenH.set(k, (seenH.get(k) || 0) + 1); }
  for (const p of profiles) if (!p.header.blank && seenH.get(p.name.trim().toLowerCase()) > 1) p.header.dup = true;
  const data = profiles.filter(p => p.role !== "meta");
  const dataIdx = data.map(p => p.idx);
  const idCols = data.filter(p => p.role === "id").map(p => p.idx);
  const nearCols = data.filter(p => p.role !== "id").map(p => p.idx);
  const metaP = profiles.find(p => p.role === "meta");
  const flagged = r => metaP ? R[r][metaP.idx] !== "" : false;
  const exactSeen = new Map(), nearSeen = new Map(), exact = [], near = [], coll = [];
  const idSeen = idCols.map(() => new Map());
  for (let r = 0; r < n; r++) {
    const row = R[r];
    let k = ""; for (const c of dataIdx) k += row[c] + SEP;
    if (exactSeen.has(k)) { exact.push([r, exactSeen.get(k)]); continue; }
    exactSeen.set(k, r);
    let nk = "", any = false;
    for (const c of nearCols) { const v = row[c]; let s = ""; if (!isNullish(v)) { s = collapse(v).trim().toLowerCase(); any = true; } nk += s + SEP; }
    if (any) { if (nearSeen.has(nk)) near.push([r, nearSeen.get(nk)]); else nearSeen.set(nk, r); }
    idCols.forEach((c, i) => { const v = row[c].trim(); if (isNullish(v)) return; const m = idSeen[i]; if (m.has(v)) coll.push([r, m.get(v), c, v]); else m.set(v, r); });
    if (r % 20000 === 19999) await tick();
  }
  const A = { n, cols: H.length, headers: H.slice(), profiles, dups: { exact, near, coll }, ragged: table.ragged || 0, blankRows: table.blankRows || 0, delimiter: table.delimiter };
  A.issues = buildIssues(A);
  A.scores = scoreAudit(A, flagged);
  if (onProgress) onProgress(1);
  return A;
}

function buildIssues(A) {
  const out = [];
  const add = (type, sev, p, count, unit, examples, extra) => out.push({ type, sev, col: p ? p.name : null, colIdx: p ? p.idx : -1, count, unit, examples: examples || [], extra: extra || {} });
  for (const p of A.profiles) {
    if (p.role === "meta") continue;
    if (p.header.blank) add("blank_header", "high", p, 1, "col", []);
    else if (p.header.vague) add("vague_header", "high", p, 1, "col", [p.name]);
    if (p.header.dup) add("dup_header", "high", p, 1, "col", [p.name]);
    if (p.header.ws) add("header_ws", "medium", p, 1, "col", [JSON.stringify(p.name)]);
    if (p.type === "empty") { add("empty_column", "high", p, p.n, "cell", [...p.nullForms.keys()].slice(0, 3).map(x => JSON.stringify(x))); continue; }
    if (p.nullTok) { const forms = [...p.nullForms.keys()]; add("null_tokens", forms.length > 1 || p.nulls > p.nullTok ? "medium" : "low", p, p.nullTok, "cell", forms.slice(0, 5).map(x => JSON.stringify(x))); }
    if (p.nullPct >= 0.1) add("missing", p.nullPct >= 0.4 ? "medium" : "low", p, p.nulls, "cell", [Math.round(p.nullPct * 100) + "%"]);
    if (p.ws) add("whitespace", "low", p, p.ws, "cell", p.wsEx.map(x => JSON.stringify(x)));
    if ((p.type === "date" || p.type === "datetime") && p.nonIso) add("dates", p.dateFormats.size > 1 ? "high" : "medium", p, p.nonIso, "cell", p.nonIsoEx, { formats: [...p.dateFormats.keys()].join(" · ") });
    if (p.currencies.size > 1) add("mixed_currency", "high", p, p.fmtCells, "cell", [...p.currencies.keys()]);
    if ((p.type === "number" || p.type === "integer") && p.fmtCells) add("num_text", "high", p, p.fmtCells, "cell", p.fmtEx);
    if (p.type === "measure") add("units", p.units.size > 1 ? "high" : "medium", p, p.nonNull - p.invalid, "cell", p.fmtEx, { units: [...p.units.keys()].join(", ") });
    if (p.type === "category" && p.clusters.length) add("variants", "medium", p, p.catOff, "cell", p.clusters.slice(0, 2).map(c => c.variants.map(x => x.v).join(" / ")));
    if (p.type === "email" && p.invalid) add("bad_email", "medium", p, p.invalid, "cell", p.invalidEx);
    else if (p.type === "email" && p.emailUpper) add("email_case", "low", p, p.emailUpper, "cell", []);
    if (p.type !== "email" && p.invalid) add("off_type", "medium", p, p.invalid, "cell", p.invalidEx);
    if (p.junk) add("junk", "medium", p, p.junk, "cell", p.junkEx.map(x => JSON.stringify(x)));
    if (p.emoji) add("emoji", "low", p, p.emoji, "cell", p.emojiEx);
  }
  const P = A.profiles;
  const rowEx = list => list.slice(0, 3).map(([r, f]) => "#" + (r + 1) + " ≈ #" + (f + 1));
  if (A.dups.exact.length) add("exact_dups", "high", null, A.dups.exact.length, "row", rowEx(A.dups.exact));
  if (A.dups.near.length) add("near_dups", "medium", null, A.dups.near.length, "row", rowEx(A.dups.near));
  if (A.dups.coll.length) add("id_collision", "high", P[A.dups.coll[0][2]], A.dups.coll.length, "row", A.dups.coll.slice(0, 3).map(x => x[3] + " (#" + (x[1] + 1) + ", #" + (x[0] + 1) + ")"));
  if (A.ragged) add("ragged", "medium", null, A.ragged, "row", []);
  const styles = new Set(P.filter(p => p.role !== "meta" && !p.header.blank).map(p => p.header.clean ? "snake" : /\s/.test(p.name.trim()) ? "space" : /[A-Z]/.test(p.name) ? "caps" : "other"));
  if (styles.size > 1) add("header_style", "low", null, P.filter(p => p.role !== "meta" && !p.header.clean).length, "col", P.filter(p => p.role !== "meta" && !p.header.clean).slice(0, 4).map(p => JSON.stringify(p.name)));
  const rank = { high: 0, medium: 1, low: 2 };
  out.sort((a, b) => rank[a.sev] - rank[b.sev] || b.count - a.count);
  return out;
}

function scoreAudit(A, flagged) {
  const P = A.profiles.filter(p => p.role !== "meta");
  const n = Math.max(1, A.n), cells = Math.max(1, A.n * P.length);
  let nulls = 0, incons = 0, nonNullCells = 0, invalid = 0;
  for (const p of P) {
    nulls += p.nulls; nonNullCells += p.nonNull;
    let inc = p.nullTok + p.ws + p.catOff + p.emailUpper;
    if (p.type === "date" || p.type === "datetime") inc += p.nonIso;
    if (p.type === "number" || p.type === "integer" || p.type === "measure") inc += p.fmtCells;
    incons += Math.min(inc, p.n);
    invalid += p.invalid + p.junk + 0.5 * p.emoji;
  }
  const completeness = 100 * Math.exp(-2 * nulls / cells);
  const consistency = 100 * Math.exp(-4 * incons / Math.max(1, nonNullCells + P.reduce((s, p) => s + p.nullTok, 0)));
  let dupW = A.dups.exact.length;
  for (const [r] of A.dups.near) dupW += flagged(r) ? 0.35 : 1;
  for (const [r] of A.dups.coll) dupW += flagged(r) ? 0.35 : 1;
  const uniqueness = 100 * Math.exp(-6 * dupW / n);
  const validity = 100 * Math.exp(-8 * (invalid + A.ragged) / Math.max(1, nonNullCells));
  let sch = 0;
  for (const p of P) {
    if (p.type === "empty") continue;
    const nameOK = !p.header.blank && !p.header.vague && !p.header.dup ? 1 : 0;
    const style = p.header.clean ? 1 : p.header.ws ? 0 : 0.5;
    const typed = p.invalid === 0 && !(p.type === "measure") && !(p.fmtCells && p.type !== "measure") ? 1 : 0.5;
    sch += 0.6 * nameOK + 0.2 * style + 0.2 * typed;
  }
  const schema = 100 * sch / Math.max(1, P.length);
  const s = { completeness, consistency, uniqueness, validity, schema };
  for (const k in s) s[k] = Math.max(0, Math.min(100, Math.round(s[k])));
  s.overall = Math.round(0.2 * s.completeness + 0.25 * s.consistency + 0.15 * s.uniqueness + 0.2 * s.validity + 0.2 * s.schema);
  return s;
}

/* ---------- plan ---------- */
const FIX_ORDER = ["encoding", "emoji", "trim", "nulls", "drop_empty", "dates", "numbers", "units", "emails", "categories", "dedupe", "flag_near", "blank_bad", "headers"];
function suggestName(p, used) {
  let base;

/* ---------- score visual: a bowl filling with calm water ---------- */
function bowl(score, small) {
  const size = small ? 96 : 150, r = size / 2 - 4, cx = size / 2, id = "b" + Math.random().toString(36).slice(2, 8);
  const fillY = size - 4 - (size - 8) * score / 100;

  const w = 120, amp = small ? 2.5 : 4;
  let d = `M0 ${amp}`; for (let x = 0; x <= size + w * 2; x += w / 2) d += ` Q ${x + w / 4} ${(x / (w / 2)) % 2 ? amp * 2 : 0} ${x + w / 2} ${amp}`;
  d += ` V ${size} H 0 Z`;
  return `<div class="bowl ${small ? "small" : ""}" role="img" aria-label="${t("readiness")} ${score}/100">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs><clipPath id="${id}"><circle cx="${cx}" cy="${cx}" r="${r - 3}"/></clipPath></defs>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="var(--paper)" stroke="var(--thread)" stroke-width="1.5"/>
    <g clip-path="url(#${id})"><g class="water" style="transform:translateY(${fillY - amp}px)"><path class="wave" d="${d}" fill="${col}" opacity=".28"/><path class="wave" style="animation-duration:11s;animation-direction:reverse" d="${d}" fill="${col}" opacity=".22" transform="translate(-30 2)"/></g></g></svg>
    <div class="bowl-num"><b>${score}</b><small>${t("outOf")}</small></div></div>`;
}

async function readFileText(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf[0] === 0xFF && buf[1] === 0xFE) return new TextDecoder("utf-16le").decode(buf);
  if (buf[0] === 0xFE && buf[1] === 0xFF) return new TextDecoder("utf-16be").decode(buf);
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { try { return new TextDecoder("windows-1252").decode(buf); } catch (e2) { return new TextDecoder().decode(buf); } }
}
async function ingestFile(file) {
  if (file.size > 30 * 1024 * 1024) toast(t("big", { mb: (file.size / 1048576).toFixed(0) }));
  veil(true, t("busyRead")); await frame();
  try { const text = await readFileText(file); await ingest(text, file.name); }
  catch (e) { veil(false); toast(t("errParse", { msg: e.message || e })); }
}
async function ingest(text, name) {
  if (!text || !String(text).trim()) { toast(t("errEmpty")); return; }
  try {
    veil(true, t("busyParse")); await frame();
    const tbl = parseText(text, name);
    if (!tbl.headers.length) throw new Error("no columns");
    S.raw = tbl; S.name = name || "pasted.csv";
    veil(true, t("busyAudit")); await frame();
    S.audit = await audit(tbl, veilProgress);
    S.plan = defaultPlan(S.audit);
    S.dictEdits = {}; S.leaf = 0; S.leafDir = "";
    await runFold(false);
    S.reached = { gather: true, look: true, letgo: true, putaway: true };
    veil(false);
    S.step = "look"; renderAll(); window.scrollTo({ top: 0 });
  } catch (e) { console.error(e); veil(false); toast(t("errParse", { msg: e.message || e })); }
}
async function runFold(showVeil) {
  if (showVeil) { veil(true, t("busyFix")); await frame(); }
  S.result = await applyFixes(S.raw, S.audit, S.plan, veilProgress, LANG === "zh" ? NOTE_ZH : NOTE_EN);
  S.after = await audit({ headers: S.result.headers, rows: S.result.rows, ragged: 0 }, null);
  S.dict = buildDict();
  S.pending = false;
  if (showVeil) veil(false);
}

  S.leafDir = i > S.leaf ? "turn-next" : "turn-prev"; S.leaf = i;
  $("#leafStage").innerHTML = leafHTML();
  document.querySelectorAll(".tab-cloth").forEach((b, k) => { b.classList.toggle("on", k === i); b.setAttribute("aria-selected", String(k === i)); if (k === i) b.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" }); });
}

/* ---------- III · thank & let go ---------- */
function renderLetGo() {
  const el = $("#ch-letgo"); if (!S.audit || !S.result) { el.innerHTML = ""; return; }
  const A = S.audit, plan = S.plan, cnt = fixCounts(A, plan), b = A.scores, a = S.after.scores;
  const gestures = FIX_ORDER.map(f => { const n = cnt[f] || 0; return `<div class="gesture ${n ? "" : "idle"}"><input type="checkbox" id="fx-${f}" data-fix="${f}" ${plan.fixes[f] ? "checked" : ""}><label for="fx-${f}"><span class="g-name">${t("fx_" + f)}</span><span class="g-desc">${t("fxd_" + f)}</span></label><span class="g-n">${n ? t("nFound", { n: fmtN(n) }) : t("nNone")}</span></div>`; }).join("");
  const catCols = Object.keys(plan.clusters);
  const clusters = catCols.length ? `<div class="linen-card" style="margin-top:20px"><p class="section-title">${t("clustersTitle")}</p><p class="section-sub">${t("clustersSub")}</p>${catCols.map(c => plan.clusters[c].map((cl, ci) => `<div class="cluster"><div class="cluster-h"><span class="hush">${t("keepAs")}</span><input class="label-field" data-canon="${c}:${ci}" value="${esc(cl.canonical)}"><span class="hush">${t("inColumn")}</span><span class="mono">${esc(A.profiles[c].name.trim())}</span></div><div class="pile">${cl.variants.map((x, vi) => `<label class="${x.on ? "" : "off"}"><input type="checkbox" data-cl="${c}:${ci}:${vi}" ${x.on ? "checked" : ""}>${esc(x.v)} <em>×${fmtN(x.c)}</em></label>`).join("")}</div></div>`).join("")).join("")}</div>` : "";
  const P = A.profiles.filter(p => p.role !== "meta");
  const names = `<div class="linen-card" style="margin-top:20px"><p class="section-title">${t("namesTitle")}</p><p class="section-sub">${t("namesSub")}</p><table class="rename-table"><tbody>${P.map(p => `<tr><td>${p.header.blank ? "∅" : showName(p.name)}</td><td class="hush" style="font-size:12.5px;width:110px">${typeName(p)}</td><td><input class="label-field" data-rn="${p.idx}" value="${esc(plan.renames[p.idx] || "")}"></td></tr>`).join("")}</tbody></table></div>`;
  const row = k => { const d = a[k] - b[k]; return `<div><span class="soft">${t("sc_" + k)}</span><span class="num hush">${b[k]}</span><span class="hush">→</span><span class="num">${a[k]}</span><span class="delta ${d < 0 ? "neg" : ""}">${d > 0 ? "+" + d : d === 0 ? "" : d}</span></div>`; };
  el.innerHTML = `
  <div class="verse"><div class="numeral">${t("x_num")}</div><h2>${t("x_title")}</h2><p>${t("x_sub")}</p></div>
  <div class="letgo-grid">
    <div class="linen-card"><p class="section-title">${t("gestures")}</p><p class="section-sub">${t("gesturesSub")}</p>${gestures}</div>
    <div class="linen-card" style="position:sticky;top:12px">
      <p class="section-title">${t("beforeAfter")}</p>
      <div class="before-after" style="margin-top:10px"><div style="text-align:center">${bowl(b.overall, true)}<div class="hush" style="font-size:12px">${t("beforeLbl")}</div></div><span class="arrow-soft">→</span><div style="text-align:center">${bowl(a.overall, true)}<div class="hush" style="font-size:12px">${t("afterLbl")}</div></div></div>
      <div class="compare-rows">${["completeness", "consistency", "uniqueness", "validity", "schema"].map(row).join("")}</div>
      <div style="margin-top:18px" class="stack-gap"><p class="pending-note" id="pendingNote" ${S.pending ? "" : "hidden"}>${t("pending")}</p><button class="gentle-btn clay" data-act="fold">${t(S.pending ? "reapplyBtn" : "applyBtn")}</button></div>
    </div>
  </div>
  ${clusters}${names}
  <div class="linen-card" style="margin-top:20px" id="foldPreview">${previewHTML()}</div>
  <div class="row-gap" style="margin-top:28px;justify-content:flex-end"><button class="gentle-btn" data-go="putaway">${t("toPutAway")}</button></div>`;
}
function previewHTML() {
  const R = S.result, raw = S.raw, LIM = 200;
  const idx = [];
  for (let i = 0; i < R.rows.length && idx.length < LIM; i++) {
    if (S.onlyChanged) {
      const o = R.origRow[i], row = R.rows[i]; let ch = false;
      for (let j = 0; j < row.length; j++) { const c = R.origCol[j]; if (c < 0 ? row[j] !== "" : row[j] !== raw.rows[o][c]) { ch = true; break; } }
      if (!ch) continue;
    }
    idx.push(i);
  }
  let k = 0;
  let h = `<table><thead><tr><th class="rn">#</th>${R.headers.map((x, j) => { const c = R.origCol[j]; const old = c >= 0 ? raw.headers[c] : null; return `<th>${esc(x)}${old != null && old !== x ? `<small>${esc(old.trim() || "∅")}</small>` : ""}</th>`; }).join("")}</tr></thead><tbody>`;
  for (const i of idx) {
    const o = R.origRow[i], row = R.rows[i];
    h += `<tr><td class="rn">${i + 1}</td>`;
    for (let j = 0; j < row.length; j++) {
      const c = R.origCol[j], v = row[j];
      if (c < 0) { h += `<td class="c-flag" title="${esc(v)}">${esc(v)}</td>`; continue; }
      const was = raw.rows[o][c];
      if (v !== was) { const d = S.foldAnim ? `style="--d:${Math.min(1.2, (k++) * 0.012).toFixed(3)}s"` : ""; h += `<td class="folded" ${d} title="${esc(was)} → ${esc(v)}">${v === "" ? `<span class="hush">∅</span>` : esc(v)}<del>${esc(was) || "∅"}</del></td>`; }
      else h += `<td>${esc(v)}</td>`;
    }
    h += "</tr>";
  }
  h += "</tbody></table>";
  S.foldAnim = false;
  return `<div class="row-gap" style="justify-content:space-between;margin-bottom:10px"><div><p class="section-title">${t("previewTitle")}</p><p class="section-sub" style="margin:0">${t("previewSub", { n: fmtN(Math.min(LIM, idx.length)), total: fmtN(R.rows.length) })}${R.removed.length ? " · " + t("letGoRows", { n: fmtN(R.removed.length) }) : ""}</p></div><label class="toggle-line"><input type="checkbox" data-act="onlyChanged" ${S.onlyChanged ? "checked" : ""}>${t("onlyChanged")}</label></div><div class="tray">${h}</div>`;
}
function markPending() {
  S.pending = true;
  const n = $("#pendingNote"); if (n) n.hidden = false;
  const b = document.querySelector('[data-act="fold"]'); if (b) b.textContent = t("reapplyBtn");
}

/* ---------- IV · put away ---------- */
function buildDict() {
  const R = S.result, Aa = S.after, old = S.dictEdits;
  return R.headers.map((name, j) => {
    const p = Aa.profiles[j], src = R.origCol[j] >= 0 ? S.audit.profiles[R.origCol[j]] : null;
    const type = name === "_review_flag" ? "string" : dictType(p);
    const unit = R.units[name] || "";
    let allowed = "";
    if ((p.type === "category" || p.type === "boolean") && p.distinct <= 40) {
      const vals = []; const seen = new Set();
      for (const row of R.rows) { const v = row[j]; if (v !== "" && !seen.has(v)) { seen.add(v); vals.push(v); if (vals.length > 40) break; } }
      allowed = vals.sort().join(", ");
    }
    const e = old[name] || {};
    return { name, type: e.type || type, desc: e.desc != null ? e.desc : draftDesc(name, type, p, unit, allowed), allowed: e.allowed != null ? e.allowed : allowed, unit: e.unit != null ? e.unit : unit, nullPct: p.nullPct, min: typeof p.min === "number" ? p.min : null, max: typeof p.max === "number" ? p.max : null, srcName: src ? src.name : null };
  });
}
function draftDesc(name, type, p, unit, allowed) {
  if (name === "_review_flag") return t("d_flag");
  let s = "";
  if (type === "id") s = t("d_id");
  else if (type === "date" || type === "datetime") s = t("d_" + type) + (p.min ? " " + t("d_range", { min: p.min, max: p.max }) : "");
  else if (type === "integer" || type === "number") { s = t("d_number"); if (unit) s += " " + t(/^[A-Z]{3}$/.test(unit) ? "d_cur" : "d_unit", { unit }); if (p.min != null) s += " " + t("d_range", { min: numStr(p.min, 2), max: numStr(p.max, 2) }); }
  else if (type === "category") s = t("d_category", { n: allowed ? allowed.split(", ").length : p.distinct });
  else if (type === "email") s = t("d_email");
  else if (type === "boolean") s = t("d_boolean");
  else s = t("d_text");
  return s + " " + t("d_fill");
}
const mdCell = s => String(s == null ? "" : s).replace(/\|/g, "\\|").replace(/\n/g, " ");
function dictMarkdown() {
  const D = S.dict, R = S.result, date = new Date().toISOString().slice(0, 10);
  let m = `# ${t("mdTitle")}: ${baseName()}.clean.csv\n\n${t("mdGen", { date })}\n${t("mdShape", { rows: fmtN(R.rows.length), cols: R.headers.length, score: S.after.scores.overall })}\n\n> ${t("mdHow")}\n\n`;
  m += `| ${t("lc_name")} | ${t("lc_type")} | ${t("lc_unit")} | ${t("lc_allowed")} | ${t("lc_missing")} | ${t("lc_desc")} |\n|---|---|---|---|---|---|\n`;
  for (const d of D) m += `| \`${mdCell(d.name)}\` | ${mdCell(d.type)} | ${mdCell(d.unit)} | ${mdCell(d.allowed)} | ${Math.round(d.nullPct * 100)}% | ${mdCell(d.desc)} |\n`;
  return m;
}
function logMarkdown() {
  const R = S.result, A = S.audit, now = new Date().toISOString().replace("T", " ").slice(0, 16);
  let m = `# ${t("logTitle")}: ${S.name}\n\n${now}\n\n- ${t("logSource")}: ${S.name} (${fmtN(A.n)} ${t("logRows")}, ${A.cols} ${t("logCols")})\n- ${t("logOutput")}: ${baseName()}.clean.csv (${fmtN(R.rows.length)} ${t("logRows")}, ${R.headers.length} ${t("logCols")})\n- ${t("logScore")}: ${A.scores.overall} → ${S.after.scores.overall}\n`;
  for (const k of ["completeness", "consistency", "uniqueness", "validity", "schema"]) m += `  - ${t("sc_" + k)}: ${A.scores[k]} → ${S.after.scores[k]}\n`;
  m += `\n## ${t("logSteps")}\n\n`;
  if (!R.log.length) m += t("logNone") + "\n";
  R.log.forEach((e, i) => {
    let what = t("fx_" + e.fix), unit = t("logCells");
    if (e.fix === "flag_near") { what = e.sub === "coll" ? t("logColl") : t("logNear"); unit = ""; }
    if (e.fix === "dedupe") unit = t("logRows");
    if (e.fix === "drop_empty" || e.fix === "headers") unit = "";
    const ex = e.examples.map(([a, b]) => `\`${String(a).replace(/`/g, "'")}\` → \`${String(b).replace(/`/g, "'") || "∅"}\``).join(", ");
    m += `${i + 1}. **${what}**${e.col ? ` · \`${e.col}\`` : ""}${unit || e.fix === "flag_near" || e.fix === "dedupe" ? ` · ${fmtN(e.count)} ${unit}` : ""}${ex ? ` · ${t("logEg")} ${ex}` : ""}\n`;
  });
  return m;
}
function baseName() { return (S.name || "data").replace(/\.(csv|tsv|txt|json)$/i, "") || "data"; }
function renderPutAway() {
  const el = $("#ch-putaway"); if (!S.result) { el.innerHTML = ""; return; }
  const R = S.result, D = S.dict;
  const types = ["string", "id", "integer", "number", "date", "datetime", "email", "boolean", "category"];
  el.innerHTML = `
  <div class="verse"><div class="numeral">${t("p_num")}</div><h2>${t("p_title")}</h2><p>${t("p_sub")}</p></div>
  <div class="dresser">
    ${[["csv", t("drd_csv", { rows: fmtN(R.rows.length), cols: R.headers.length }), baseName() + ".clean.csv"], ["md", t("drd_md"), baseName() + ".dictionary.md"], ["json", t("drd_json"), baseName() + ".schema.json"], ["log", t("drd_log"), baseName() + ".cleaning-log.md"]].map(([k, d, f]) => `<div class="drawer" data-drawer="${k}"><span class="tag-label">${esc(f)}</span><h3>${t("dr_" + k)}</h3><p>${d}</p><div class="row-gap"><button class="gentle-btn ${k === "csv" ? "clay" : "quiet"}" data-save="${k}">${t("download")}</button>${k === "md" ? `<button class="gentle-btn quiet" data-act="copy-md">${t("copyMd")}</button>` : ""}</div></div>`).join("")}
  </div>
  <div class="label-book">
    <div class="verse" style="margin:40px 0 14px"><h2 style="font-size:28px">${t("ledgerTitle")}</h2><p style="font-size:15px">${t("ledgerSub")}</p></div>
    <div class="ledger-wrap"><table class="ledger"><thead><tr><th>${t("lc_name")}</th><th style="width:120px">${t("lc_type")}</th><th style="min-width:260px">${t("lc_desc")}</th><th style="min-width:160px">${t("lc_allowed")}</th><th style="width:90px">${t("lc_unit")}</th><th style="width:60px">${t("lc_missing")}</th></tr></thead><tbody>
    ${D.map((d, i) => `<tr><td>${esc(d.name)}${d.srcName != null && d.srcName !== d.name ? `<div class="hush" style="font-size:11px;font-family:var(--sans)">← ${esc(d.srcName.trim() || "∅")}</div>` : ""}</td><td><select data-dict="type:${i}">${types.map(x => `<option ${x === d.type ? "selected" : ""}>${x}</option>`).join("")}</select></td><td><textarea data-dict="desc:${i}">${esc(d.desc)}</textarea></td><td><input data-dict="allowed:${i}" value="${esc(d.allowed)}"></td><td><input data-dict="unit:${i}" value="${esc(d.unit)}"></td><td class="hush">${Math.round(d.nullPct * 100)}%</td></tr>`).join("")}
    </tbody></table></div>
    <details class="whole-list"><summary>${t("mdPeek")}</summary><pre class="md-peek" id="mdPeek">${esc(dictMarkdown())}</pre></details>
  </div>`;
}
function save(kind) {
  const R = S.result; let data, name, type;
  if (kind === "csv") { data = toCSV(R.headers, R.rows); name = baseName() + ".clean.csv"; type = "text/csv"; }
  else if (kind === "md") { data = dictMarkdown(); name = baseName() + ".dictionary.md"; type = "text/markdown"; }
  else if (kind === "json") { data = JSON.stringify(jsonSchemaFor(S.dict, baseName() + ".clean.csv"), null, 2); name = baseName() + ".schema.json"; type = "application/json"; }
  else { data = logMarkdown(); name = baseName() + ".cleaning-log.md"; type = "text/markdown"; }
  const url = URL.createObjectURL(new Blob([data], { type: type + ";charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  const d = document.querySelector(`[data-drawer="${kind}"]`); if (d) { d.classList.remove("opened"); void d.offsetWidth; d.classList.add("opened"); }
  toast(t("saved", { name }));
}
async function copyMd() {
  const txt = dictMarkdown();
  try { await navigator.clipboard.writeText(txt); toast(t("copied")); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(t("copied")); } catch (e2) { } ta.remove(); }
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const g = e.target.closest("[data-go]"); if (g && !g.disabled) { go(g.dataset.go); return; }
  const lb = e.target.closest("[data-lang]");
  if (lb) { LANG = lb.dataset.lang; try { localStorage.setItem("tidy-lang", LANG); } catch (er) { } if (S.result) { S.result = await applyFixes(S.raw, S.audit, S.plan, null, LANG === "zh" ? NOTE_ZH : NOTE_EN); } if (S.dict) { const keep = S.dictEdits; S.dict = buildDict(); S.dictEdits = keep; } renderAll(); return; }
  const lf = e.target.closest("[data-leaf]"); if (lf) { turnLeaf(+lf.dataset.leaf); return; }
  const sv = e.target.closest("[data-save]"); if (sv) { save(sv.dataset.save); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "sample") ingest(makeSample(120), "customer-orders-messy.csv");
  else if (act === "stress") { veil(true, t("busyParse")); await frame(); ingest(makeSample(46500, 99), "customer-orders-50k.csv"); }
  else if (act === "paste") ingest($("#pasteBox").value, "pasted.csv");
  else if (act === "leaf-next") turnLeaf(S.leaf + 1);
  else if (act === "leaf-prev") turnLeaf(S.leaf - 1);
  else if (act === "fold") { await runFold(true); S.foldAnim = true; renderLetGo(); renderPutAway(); const pv = $("#foldPreview"); if (pv) pv.scrollIntoView({ behavior: "smooth", block: "start" }); }
  else if (act === "copy-md") copyMd();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "filePick" && el.files && el.files[0]) { ingestFile(el.files[0]); el.value = ""; return; }
  if (el.dataset.fix) { S.plan.fixes[el.dataset.fix] = el.checked; markPending(); return; }
  if (el.dataset.cl) { const [c, ci, vi] = el.dataset.cl.split(":").map(Number); S.plan.clusters[c][ci].variants[vi].on = el.checked; el.closest("label").classList.toggle("off", !el.checked); markPending(); return; }
  if (el.dataset.act === "onlyChanged") { S.onlyChanged = el.checked; $("#foldPreview").innerHTML = previewHTML(); return; }
  if (el.dataset.dict) onDict(el);
});
let mdTimer;
function onDict(el) {
  const [f, i] = el.dataset.dict.split(":"); const d = S.dict[+i];
  d[f] = el.value; (S.dictEdits[d.name] || (S.dictEdits[d.name] = {}))[f] = el.value;
  clearTimeout(mdTimer); mdTimer = setTimeout(() => { const p = $("#mdPeek"); if (p) p.textContent = dictMarkdown(); }, 250);
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.rn) { S.plan.renames[+el.dataset.rn] = el.value.trim(); document.querySelectorAll(`[data-rn="${el.dataset.rn}"]`).forEach(x => { if (x !== el) x.value = el.value; }); markPending(); return; }
  if (el.dataset.canon) { const [c, ci] = el.dataset.canon.split(":").map(Number); S.plan.clusters[c][ci].canonical = el.value; markPending(); return; }
  if (el.dataset.dict) onDict(el);
});
document.addEventListener("keydown", e => {
  if (S.step !== "look" || /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ""))) return;
  if (e.key === "ArrowRight") turnLeaf(S.leaf + 1); else if (e.key === "ArrowLeft") turnLeaf(S.leaf - 1);
});
renderAll();
</script>
